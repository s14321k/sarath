<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-container">
    <header class="admin-header">
        <h1>Visit Admin</h1>
        <p>Login to view visit statistics.</p>
    </header>

    <section class="admin-card" id="loginCard">
        <h2>Login</h2>
        <form id="adminLoginForm" class="admin-form">
            <label>
                Username
                <input type="text" id="adminUser" required>
            </label>
            <label>
                Password
                <input type="password" id="adminPass" required>
            </label>
            <div class="admin-error" id="adminError"></div>
            <button type="submit">Sign In</button>
        </form>
    </section>

    <section class="admin-card hidden" id="statsCard">
        <div class="stats-header">
            <h2>Visits</h2>
            <div class="stats-actions">
                <button id="dashboardBtn" type="button">Dashboard View</button>
                <button id="tableBtn" type="button">Table View</button>
                <button id="refreshBtn" type="button">Refresh</button>
            </div>
        </div>
        <div class="dashboard-view hidden" id="dashboardView">
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Total Unique Pages</h3>
                    <div class="big-number" id="totalPagesCount">0</div>
                </div>
                <div class="dashboard-card">
                    <h3>Most Visited Page</h3>
                    <div class="small-text" id="mostVisitedPage">-</div>
                    <div class="small-text" id="mostVisitedCount">0 visits</div>
                </div>
                <div class="dashboard-card chart-card">
                    <h3>Top Pages</h3>
                    <canvas id="topPagesChart"></canvas>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card chart-card">
                    <h3>Daily Hits</h3>
                    <canvas id="dailyChart"></canvas>
                </div>
                <div class="dashboard-card chart-card">
                    <h3>Weekly Hits</h3>
                    <canvas id="weeklyChart"></canvas>
                </div>
                <div class="dashboard-card chart-card">
                    <h3>Monthly Hits</h3>
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>
        <div class="admin-table-wrap">
            <table class="admin-table" id="statsTable">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Page Name (Count / Hours / Last Seen)</th>
                    <th>Login Count</th>
                    <th>Last Login</th>
                    <th>Total Visits</th>
                    <th>User Agents</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</div>

<script src="js/visit-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
