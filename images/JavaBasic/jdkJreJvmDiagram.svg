<svg width="100%" viewBox="0 0 980 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JDK, JRE, and JVM quick diagram</title>
  <desc id="desc">Three separate cards explaining JDK, JRE, and JVM with arrows showing JDK contains JRE and JRE contains JVM.</desc>

  <defs>
    <style>
      text {
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .title {
        fill: #f8fafc;
        font-size: 30px;
        font-weight: 700;
      }
      .subtitle {
        fill: #cbd5e1;
        font-size: 15px;
      }
      .card-title {
        fill: #ffffff;
        font-size: 23px;
        font-weight: 700;
      }
      .card-subtitle {
        fill: #dbeafe;
        font-size: 15px;
        font-weight: 600;
      }
      .section {
        fill: #ffffff;
        font-size: 15px;
        font-weight: 700;
      }
      .body {
        fill: #e5eefb;
        font-size: 14px;
      }
      .small {
        fill: #cbd5e1;
        font-size: 13px;
      }
      .table-head {
        fill: #0f172a;
        font-size: 14px;
        font-weight: 700;
      }
      .table-text {
        fill: #1e293b;
        font-size: 14px;
      }
      .arrow-label {
        fill: #fef3c7;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="900" fill="#0f172a"/>

  <text x="40" y="56" class="title">JDK vs JRE vs JVM</text>
  <text x="40" y="84" class="subtitle">Simple rule: JDK contains JRE, and JRE contains JVM.</text>

  <line x1="310" y1="165" x2="395" y2="165" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="324" y="148" class="arrow-label">contains</text>

  <line x1="635" y1="165" x2="720" y2="165" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="649" y="148" class="arrow-label">contains</text>

  <rect x="40" y="190" width="270" height="430" rx="22" fill="#153b73" stroke="#7fb0f5" stroke-width="2"/>
  <text x="62" y="230" class="card-title">JDK</text>
  <text x="62" y="258" class="card-subtitle">Java Development Kit</text>

  <text x="62" y="300" class="section">What it is</text>
  <text x="62" y="326" class="body">- Complete package for Java development</text>
  <text x="62" y="348" class="body">- Contains JRE + development tools</text>

  <text x="62" y="390" class="section">Includes</text>
  <text x="62" y="416" class="body">- JRE</text>
  <text x="62" y="438" class="body">- `javac` compiler</text>
  <text x="62" y="460" class="body">- `java` launcher</text>
  <text x="62" y="482" class="body">- Debugger</text>
  <text x="62" y="504" class="body">- `jar` packaging tool</text>

  <text x="62" y="546" class="section">Use</text>
  <text x="62" y="572" class="body">- Needed to develop Java applications</text>
  <text x="62" y="594" class="body">- Used to compile, debug, and run code</text>

  <rect x="365" y="190" width="270" height="430" rx="22" fill="#116149" stroke="#63d2b0" stroke-width="2"/>
  <text x="387" y="230" class="card-title">JRE</text>
  <text x="387" y="258" class="card-subtitle">Java Runtime Environment</text>

  <text x="387" y="300" class="section">What it is</text>
  <text x="387" y="326" class="body">- Environment to run Java applications</text>
  <text x="387" y="348" class="body">- Contains JVM + Java libraries</text>

  <text x="387" y="390" class="section">Includes</text>
  <text x="387" y="416" class="body">- JVM</text>
  <text x="387" y="438" class="body">- Core Java libraries</text>
  <text x="387" y="460" class="body">- Supporting runtime files</text>

  <text x="387" y="502" class="section">Does NOT include</text>
  <text x="387" y="528" class="body">- No `javac` compiler</text>
  <text x="387" y="550" class="body">- No development tools</text>

  <text x="387" y="592" class="section">Use</text>
  <text x="387" y="618" class="body">- Needed only to run Java apps</text>

  <rect x="690" y="190" width="250" height="430" rx="22" fill="#5d3ea8" stroke="#c4b5fd" stroke-width="2"/>
  <text x="712" y="230" class="card-title">JVM</text>
  <text x="712" y="258" class="card-subtitle">Java Virtual Machine</text>

  <text x="712" y="300" class="section">What it is</text>
  <text x="712" y="326" class="body">- Virtual machine that runs bytecode</text>
  <text x="712" y="348" class="body">- Works on `.class` files</text>

  <text x="712" y="390" class="section">Main responsibilities</text>
  <text x="712" y="416" class="body">- Converts bytecode to machine code</text>
  <text x="712" y="438" class="body">- Handles memory management</text>
  <text x="712" y="460" class="body">- Provides security</text>
  <text x="712" y="482" class="body">- Runs execution engine</text>

  <text x="712" y="524" class="section">Main components</text>
  <text x="712" y="550" class="body">- Class Loader</text>
  <text x="712" y="572" class="body">- Heap, Stack, Method Area</text>
  <text x="712" y="594" class="body">- PC Register</text>
  <text x="712" y="616" class="body">- Garbage Collector</text>

  <text x="40" y="676" class="section">One-line summary</text>
  <text x="40" y="702" class="small">JVM runs Java bytecode. JRE gives what is needed to run Java. JDK gives what is needed to develop and run Java.</text>

  <text x="40" y="748" class="section">Quick comparison</text>
  <rect x="40" y="770" width="900" height="100" rx="14" fill="#e2e8f0"/>
  <line x1="230" y1="770" x2="230" y2="870" stroke="#94a3b8" stroke-width="1"/>
  <line x1="500" y1="770" x2="500" y2="870" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="804" x2="940" y2="804" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="836" x2="940" y2="836" stroke="#94a3b8" stroke-width="1"/>

  <text x="58" y="792" class="table-head">Component</text>
  <text x="250" y="792" class="table-head">Purpose</text>
  <text x="520" y="792" class="table-head">Used For</text>

  <text x="58" y="826" class="table-text">JVM</text>
  <text x="250" y="826" class="table-text">Executes bytecode</text>
  <text x="520" y="826" class="table-text">Running Java programs</text>

  <text x="58" y="858" class="table-text">JRE</text>
  <text x="250" y="858" class="table-text">JVM + libraries</text>
  <text x="520" y="858" class="table-text">Running Java applications</text>

  <text x="58" y="890" class="table-text">JDK</text>
  <text x="250" y="890" class="table-text">JRE + development tools</text>
  <text x="520" y="890" class="table-text">Developing and running Java applications</text>
</svg>
