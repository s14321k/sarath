<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700">
  <style>
    .box { fill: #f7fbff; stroke:#2b6cb0; stroke-width:2; rx:12; }
