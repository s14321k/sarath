  <rect x="60" y="945" width="500" height="210" class="box"/>
  <text x="85" y="980" class="title">Suggested Study Sequence</text>
  <text x="85" y="1004" class="subtitle">1 → 6: Core language &amp; collections first; 7–9: runtime, concurrency; 10–12: design &amp; advanced APIs; 13: practices</text>
  <text x="85" y="1024" class="subtitle">Use small runnable examples for each item and experiment in a REPL or small projects.</text>
  <text x="85" y="1044" class="subtitle">Study tip: alternate theory with hands-on (30m reading → 60m coding).</text>

