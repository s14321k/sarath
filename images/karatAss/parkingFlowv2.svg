<svg width="100%" viewBox="0 0 682 820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Parking lot data flow: Vehicle + ParkingSession → ParkingLot → statistics and longest session</title>
  <desc>Diagram showing how vehicles and parking sessions feed into a ParkingLot and produce revenue, average duration, and longest session results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Vehicle source box -->
  <g>
    <rect x="240" y="20" width="200" height="52" rx="8" stroke-width="0.5" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236)"/>
    <text x="340" y="42" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:14px;font-weight:500">Vehicle</text>
    <text x="340" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:12px">licensePlate, type, color</text>
  </g>

  <!-- Arrow Vehicle → Sessions -->
  <line x1="340" y1="72" x2="340" y2="104" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- ParkingSession row — three sample sessions -->
  <g>
    <rect x="20" y="104" width="188" height="72" rx="8" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165)"/>
    <text x="114" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:500">Session 1 — ABC123</text>
    <text x="114" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">09:00 → 11:00  (120 min)</text>
    <text x="114" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">complete ✓  $10.00</text>
  </g>
  <g>
    <rect x="247" y="104" width="188" height="72" rx="8" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165)"/>
    <text x="341" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:500">Session 2 — XYZ789</text>
    <text x="341" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">10:00 → 12:30  (150 min)</text>
    <text x="341" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">complete ✓  $12.50</text>
  </g>
  <g>
    <rect x="474" y="104" width="188" height="72" rx="8" stroke-width="0.5" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123)"/>
    <text x="568" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:13px;font-weight:500">Session 3 — DEF456</text>
    <text x="568" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px">14:00 → null</text>
    <text x="568" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px">still parked ✗  $0.00</text>
  </g>

  <!-- Bug fix callout -->
  <rect x="20" y="186" width="642" height="30" rx="6" stroke-width="0.5" style="fill:rgb(80, 20, 20);stroke:rgb(220, 80, 80)"/>
  <text x="341" y="201" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 160, 160);font-size:12px">🐛 BUG FIX — getAverageParkingDuration(): mapToInt → mapToDouble  (prevents integer truncation in division)</text>

  <!-- Arrows Sessions → ParkingLot -->
  <line x1="114" y1="216" x2="280" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <line x1="341" y1="216" x2="340" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <line x1="568" y1="216" x2="400" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- ParkingLot box -->
  <g>
    <rect x="200" y="270" width="280" height="52" rx="8" stroke-width="0.5" style="fill:rgb(12, 68, 124);stroke:rgb(133, 183, 235)"/>
    <text x="340" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181, 212, 244);font-size:14px;font-weight:500">ParkingLot</text>
    <text x="340" y="310" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 183, 235);font-size:12px">List&lt;ParkingSession&gt; — all sessions</text>
  </g>

  <!-- Left output arrow -->
  <line x1="270" y1="322" x2="190" y2="358" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <!-- Right output arrow -->
  <line x1="410" y1="322" x2="490" y2="358" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- Revenue / Duration box -->
  <g>
    <rect x="60" y="358" width="260" height="72" rx="8" stroke-width="0.5" style="fill:rgb(39, 80, 10);stroke:rgb(151, 196, 89)"/>
    <text x="190" y="378" text-anchor="middle" dominant-baseline="central" style="fill:rgb(192, 221, 151);font-size:14px;font-weight:500">Revenue &amp; Duration</text>
    <text x="190" y="398" text-anchor="middle" dominant-baseline="central" style="fill:rgb(151, 196, 89);font-size:12px">getTotalRevenue() → $22.50</text>
    <text x="190" y="416" text-anchor="middle" dominant-baseline="central" style="fill:rgb(151, 196, 89);font-size:12px">getAverageDuration() → 135 min</text>
  </g>

  <!-- Longest Session box -->
  <g>
    <rect x="360" y="358" width="260" height="72" rx="8" stroke-width="0.5" style="fill:rgb(99, 56, 6);stroke:rgb(239, 159, 39)"/>
    <text x="490" y="378" text-anchor="middle" dominant-baseline="central" style="fill:rgb(250, 199, 117);font-size:14px;font-weight:500">getLongestParkingSession()</text>
    <text x="490" y="398" text-anchor="middle" dominant-baseline="central" style="fill:rgb(239, 159, 39);font-size:12px">filter complete, find max duration</text>
    <text x="490" y="416" text-anchor="middle" dominant-baseline="central" style="fill:rgb(239, 159, 39);font-size:12px">→ ["DEF456", 240]</text>
  </g>

  <!-- Duration formula note -->
  <text x="340" y="458" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194, 192, 182);font-size:12px">duration = exitMinutes − entryMinutes   |   fee = (duration / 60.0) × hourlyRate</text>

  <!-- Section divider -->
  <line x1="40" y1="484" x2="642" y2="484" style="stroke:rgb(211, 207, 192);stroke-width:0.6;stroke-dasharray:6,4"/>

  <!-- Dashed arrow from ParkingLot down to Session Lifecycle -->
  <line x1="340" y1="322" x2="340" y2="512" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5;stroke-dasharray:4,3"/>

  <!-- Session Lifecycle box -->
  <g>
    <rect x="50" y="512" width="260" height="90" rx="8" style="fill:#3a2c7a;stroke:#b2aeea;stroke-width:.5"/>
    <text x="180" y="536" text-anchor="middle" style="fill:#e0ddf7;font-size:14px;font-weight:500">Session Lifecycle</text>
    <text x="180" y="556" text-anchor="middle" style="fill:#b2aeea;font-size:12px">entryTime set on arrival</text>
    <text x="180" y="574" text-anchor="middle" style="fill:#b2aeea;font-size:12px">exitTime = null → still parked</text>
    <text x="180" y="592" text-anchor="middle" style="fill:#b2aeea;font-size:12px">exitTime set → complete, fee due</text>
  </g>

  <!-- Arrow from Lifecycle to Fee Calc detail -->
  <line x1="310" y1="557" x2="360" y2="557" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- Fee / Duration detail box -->
  <g>
    <rect x="360" y="504" width="300" height="148" rx="10" style="fill:#0b3a47;stroke:#7cd1e6;stroke-width:.5"/>
    <text x="510" y="528" text-anchor="middle" style="fill:#c8f1fb;font-size:14px;font-weight:600">Fee Calculation</text>
    <text x="510" y="552" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">entryMinutes = HH×60 + MM</text>
    <text x="510" y="572" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">duration = exitMinutes − entryMinutes</text>
    <text x="510" y="592" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">fee = (duration / 60.0) × hourlyRate</text>
    <text x="510" y="612" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">null exitTime → fee = 0.0</text>
    <text x="510" y="632" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">excluded from avg &amp; longest</text>
  </g>

  <!-- Arrow from detail box down to results -->
  <line x1="510" y1="652" x2="510" y2="682" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- Results box -->
  <g>
    <rect x="60" y="682" width="560" height="110" rx="8" style="fill:#1f5d1f;stroke:#97c459;stroke-width:1"/>
    <text x="340" y="706" text-anchor="middle" style="fill:#c0dd97;font-size:11px;font-weight:400;letter-spacing:1.2px">RESULTS</text>
    <text x="340" y="730" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:500">getTotalRevenue() → $22.50</text>
    <text x="340" y="754" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:500">getAverageParkingDuration() → 135.0 min</text>
    <text x="340" y="778" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:500">getLongestParkingSession() → ["DEF456", 240]</text>
  </g>

</svg>
