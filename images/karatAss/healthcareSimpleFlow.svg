<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="750" fill="#f0f4f8"/>
  
  <!-- Title -->
  <text x="500" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a365d">🏥 Healthcare Clinic System - Simple Flow</text>
  
  <!-- Patient starts -->
  <ellipse cx="500" cy="100" rx="80" ry="40" fill="#48bb78" stroke="#38a169" stroke-width="3"/>
  <text x="500" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Patient</text>
  
  <!-- Arrow down -->
  <path d="M 500 140 L 500 180" stroke="#2d3748" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Schedule Appointment -->
  <rect x="330" y="180" width="340" height="90" fill="#4299e1" stroke="#3182ce" stroke-width="3" rx="10"/>
  <text x="500" y="205" font-size="16" font-weight="bold" text-anchor="middle" fill="white">📅 Schedules Appointment</text>
  <text x="500" y="230" font-size="12" text-anchor="middle" fill="white">With Doctor, Date, Time, Type</text>
  <text x="500" y="250" font-size="11" text-anchor="middle" fill="white">Types: Checkup | Follow-up | Emergency | Consultation</text>
  
  <!-- Arrow down -->
  <path d="M 500 270 L 500 310" stroke="#2d3748" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Appointment Details -->
  <rect x="200" y="310" width="600" height="80" fill="#9f7aea" stroke="#805ad5" stroke-width="3" rx="10"/>
  <text x="500" y="335" font-size="15" font-weight="bold" text-anchor="middle" fill="white">📋 Appointment Details Stored</text>
  <text x="500" y="360" font-size="12" text-anchor="middle" fill="white">Patient Info • Doctor Name • Duration (minutes) • Date & Time</text>
  <text x="500" y="380" font-size="11" text-anchor="middle" fill="white">Example: Dr. Smith, 30 mins, 2024-02-15, 10:00 AM</text>
  
  <!-- Arrow down -->
  <path d="M 500 390 L 500 430" stroke="#2d3748" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Analytics Section -->
  <rect x="100" y="430" width="800" height="260" fill="#e6fffa" stroke="#319795" stroke-width="3" rx="10"/>
  <text x="500" y="460" font-size="18" font-weight="bold" text-anchor="middle" fill="#234e52">📊 Clinic Analytics & Insights</text>
  
  <!-- Left Column -->
  <g id="stats-left">
    <rect x="130" y="480" width="320" height="50" fill="#bee3f8" stroke="#3182ce" stroke-width="2" rx="5"/>
    <text x="290" y="510" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a365d">Total Appointments: 150</text>
    
    <rect x="130" y="545" width="320" height="50" fill="#fbb6ce" stroke="#d53f8c" stroke-width="2" rx="5"/>
    <text x="290" y="575" font-size="13" font-weight="bold" text-anchor="middle" fill="#702459">Checkups: 80, Emergency: 20</text>
    
    <rect x="130" y="610" width="320" height="50" fill="#c6f6d5" stroke="#38a169" stroke-width="2" rx="5"/>
    <text x="290" y="635" font-size="13" font-weight="bold" text-anchor="middle" fill="#22543d">Appointments on Feb 15: 12</text>
  </g>
  
  <!-- Right Column -->
  <g id="stats-right">
    <rect x="480" y="480" width="380" height="60" fill="#fed7d7" stroke="#e53e3e" stroke-width="2" rx="5"/>
    <text x="670" y="505" font-size="13" font-weight="bold" text-anchor="middle" fill="#742a2a">Average Duration: 45 mins</text>
    <text x="670" y="525" font-size="10" text-anchor="middle" fill="#e53e3e">⚠️ Bug: Returns NaN if no appointments</text>
    
    <rect x="480" y="555" width="380" height="60" fill="#bee3f8" stroke="#3182ce" stroke-width="2" rx="5"/>
    <text x="670" y="575" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a365d">Dr. Smith Appointments: 35</text>
    <text x="670" y="595" font-size="11" text-anchor="middle" fill="#2c5282">getAppointmentsForDoctor()</text>
    
    <rect x="480" y="630" width="380" height="50" fill="#fefcbf" stroke="#d69e2e" stroke-width="2" rx="5"/>
    <text x="670" y="650" font-size="13" font-weight="bold" text-anchor="middle" fill="#744210">🔨 Busiest Doctor</text>
    <text x="670" y="665" font-size="10" text-anchor="middle" fill="#975a16">New feature: Find doctor with most appointments</text>
  </g>
  
  <!-- Example Result -->
  <rect x="200" y="705" width="600" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="500" y="725" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">💡 Result: Dr. Johnson has 58 appointments (most busy)</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#2d3748"/>
    </marker>
  </defs>
</svg>
