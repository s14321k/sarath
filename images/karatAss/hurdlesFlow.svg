<svg width="100%" viewBox="0 0 682 820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Hurdles Race data flow: StageResult → HurdlesRace → getWinner / getBestOfBestTime</title>
  <desc>Diagram showing how stage results flow from athletes into a HurdlesRace and produce a winner and best-of-best time.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Athlete source box ── -->
  <g>
    <rect x="240" y="20" width="200" height="52" rx="8" stroke-width="0.5" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236)"/>
    <text x="340" y="42" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:14px;font-weight:500">Athlete</text>
    <text x="340" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:12px">athleteId, name — 4 racers</text>
  </g>

  <!-- Arrow Athlete → StageResults -->
  <line x1="340" y1="72" x2="340" y2="104" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- ── StageResult row — four athletes ── -->
  <!-- Alice (finisher, green) -->
  <g>
    <rect x="20" y="104" width="148" height="72" rx="8" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165)"/>
    <text x="94" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:500">Alice</text>
    <text x="94" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">13.5 14.2 13.8 14.0</text>
    <text x="94" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">→ 55.5 s  finisher ✓</text>
  </g>
  <!-- Bob (winner, highlighted) -->
  <g>
    <rect x="188" y="104" width="148" height="72" rx="8" stroke-width="1.5" style="fill:rgb(8, 80, 65);stroke:rgb(250, 204, 21)"/>
    <text x="262" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(253, 230, 138);font-size:13px;font-weight:500">Bob 🏆</text>
    <text x="262" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(250, 204, 21);font-size:11px">12.9 13.7 14.1 13.5</text>
    <text x="262" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(250, 204, 21);font-size:11px">→ 54.2 s  winner ✓</text>
  </g>
  <!-- Carol (finisher, green) -->
  <g>
    <rect x="356" y="104" width="148" height="72" rx="8" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165)"/>
    <text x="430" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:500">Carol</text>
    <text x="430" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">14.1 13.5 13.9 14.3</text>
    <text x="430" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">→ 55.8 s  finisher ✓</text>
  </g>
  <!-- Dave (DNF, red) -->
  <g>
    <rect x="524" y="104" width="148" height="72" rx="8" stroke-width="0.5" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123)"/>
    <text x="598" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:13px;font-weight:500">Dave</text>
    <text x="598" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px">13.2  13.4  13.6  —</text>
    <text x="598" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px">→ 40.2 s  DNF ✗</text>
  </g>

  <!-- Bug fix callout -->
  <rect x="20" y="186" width="642" height="30" rx="6" stroke-width="0.5" style="fill:rgb(80, 20, 20);stroke:rgb(220, 80, 80)"/>
  <text x="341" y="201" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 160, 160);font-size:12px">🐛 BUG FIX — getWinner(): add  if (!hasFinished(id)) continue;  to exclude DNF athletes like Dave</text>

  <!-- Arrows StageResults → HurdlesRace -->
  <line x1="94" y1="216" x2="280" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <line x1="262" y1="216" x2="310" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <line x1="430" y1="216" x2="370" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <line x1="598" y1="216" x2="400" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- HurdlesRace box -->
  <g>
    <rect x="200" y="270" width="280" height="52" rx="8" stroke-width="0.5" style="fill:rgb(12, 68, 124);stroke:rgb(133, 183, 235)"/>
    <text x="340" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181, 212, 244);font-size:14px;font-weight:500">HurdlesRace</text>
    <text x="340" y="310" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 183, 235);font-size:12px">List&lt;StageResult&gt; — all stage times</text>
  </g>

  <!-- getWinner arrow -->
  <line x1="270" y1="322" x2="190" y2="358" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <!-- getBestOfBestTime arrow -->
  <line x1="410" y1="322" x2="490" y2="358" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- getWinner box -->
  <g>
    <rect x="60" y="358" width="260" height="72" rx="8" stroke-width="0.5" style="fill:rgb(39, 80, 10);stroke:rgb(151, 196, 89)"/>
    <text x="190" y="382" text-anchor="middle" dominant-baseline="central" style="fill:rgb(192, 221, 151);font-size:14px;font-weight:500">getWinner()</text>
    <text x="190" y="402" text-anchor="middle" dominant-baseline="central" style="fill:rgb(151, 196, 89);font-size:12px">finishers only → min total time</text>
    <text x="190" y="420" text-anchor="middle" dominant-baseline="central" style="fill:rgb(151, 196, 89);font-size:12px">→ "Bob"  (54.2 s)</text>
  </g>

  <!-- getBestOfBestTime box -->
  <g>
    <rect x="360" y="358" width="260" height="72" rx="8" stroke-width="0.5" style="fill:rgb(99, 56, 6);stroke:rgb(239, 159, 39)"/>
    <text x="490" y="378" text-anchor="middle" dominant-baseline="central" style="fill:rgb(250, 199, 117);font-size:13px;font-weight:500">getBestOfBestTime()</text>
    <text x="490" y="398" text-anchor="middle" dominant-baseline="central" style="fill:rgb(239, 159, 39);font-size:12px">min per stage (all athletes)</text>
    <text x="490" y="416" text-anchor="middle" dominant-baseline="central" style="fill:rgb(239, 159, 39);font-size:12px">12.9+13.4+13.6+13.5 = 53.4 s</text>
  </g>

  <!-- Stage minimums note -->
  <text x="340" y="460" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194, 192, 182);font-size:12px">stage bests: S1=12.9 (Bob)  S2=13.4 (Dave)  S3=13.6 (Dave)  S4=13.5 (Bob)  — DNF athletes contribute to stage bests</text>

  <!-- Section divider -->
  <line x1="40" y1="488" x2="642" y2="488" style="stroke:rgb(211, 207, 192);stroke-width:0.6;stroke-dasharray:6,4"/>

  <!-- Dashed arrow from HurdlesRace down to hasFinished detail -->
  <line x1="340" y1="322" x2="340" y2="516" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5;stroke-dasharray:4,3"/>

  <!-- hasFinished box -->
  <g>
    <rect x="50" y="516" width="260" height="90" rx="8" style="fill:#3a2c7a;stroke:#b2aeea;stroke-width:.5"/>
    <text x="180" y="540" text-anchor="middle" style="fill:#e0ddf7;font-size:14px;font-weight:500">hasFinished(id)</text>
    <text x="180" y="560" text-anchor="middle" style="fill:#b2aeea;font-size:12px">count distinct stageNumbers</text>
    <text x="180" y="578" text-anchor="middle" style="fill:#b2aeea;font-size:12px">for this athlete's results</text>
    <text x="180" y="596" text-anchor="middle" style="fill:#b2aeea;font-size:12px">== 4  →  true (finisher)</text>
  </g>

  <!-- Arrow from hasFinished to detail box -->
  <line x1="310" y1="561" x2="360" y2="561" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- Winner selection detail box -->
  <g>
    <rect x="360" y="508" width="300" height="148" rx="10" style="fill:#0b3a47;stroke:#7cd1e6;stroke-width:.5"/>
    <text x="510" y="532" text-anchor="middle" style="fill:#c8f1fb;font-size:14px;font-weight:600">Winner Selection Logic</text>
    <text x="510" y="556" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">For each unique athleteId:</text>
    <text x="510" y="576" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">  if (!hasFinished) → skip</text>
    <text x="510" y="596" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">  total = getTotalTime(id)</text>
    <text x="510" y="616" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">  if total &lt; bestTime → update</text>
    <text x="510" y="636" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">  return idToName.get(winnerId)</text>
  </g>

  <!-- Arrow from detail box down to results -->
  <line x1="510" y1="656" x2="510" y2="686" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- Results box -->
  <g>
    <rect x="60" y="686" width="560" height="110" rx="8" style="fill:#1f5d1f;stroke:#97c459;stroke-width:1"/>
    <text x="340" y="710" text-anchor="middle" style="fill:#c0dd97;font-size:11px;font-weight:400;letter-spacing:1.2px">RESULTS</text>
    <text x="340" y="736" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:500">getWinner() → "Bob"  (54.2 s, lowest among finishers)</text>
    <text x="340" y="762" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:500">getBestOfBestTime() → 53.4 s  (dream-team total)</text>
    <text x="340" y="784" text-anchor="middle" style="fill:#c0dd97;font-size:11px">Dave's 40.2 s (DNF) excluded from winner — but Stage 2 &amp; 3 still count toward bestOfBest</text>
  </g>

</svg>
