<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="'Georgia', serif">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10100a"/>
      <stop offset="100%" style="stop-color:#1a180a"/>
    </linearGradient>
    <linearGradient id="hdrP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78350f"/>
      <stop offset="100%" style="stop-color:#92400e"/>
    </linearGradient>
    <linearGradient id="cardP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1608"/>
      <stop offset="100%" style="stop-color:#221c0a"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowAm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowRd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="900" height="720" fill="url(#bgP)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#fef9c3" letter-spacing="3" filter="url(#glow3)">PARKING LOT MANAGEMENT SYSTEM</text>
  <line x1="80" y1="48" x2="820" y2="48" stroke="#78350f" stroke-width="1"/>

  <!-- Parking lot visual -->
  <text x="450" y="68" text-anchor="middle" font-size="10" fill="#6b5a2a" letter-spacing="2">LOT LAYOUT</text>
  <rect x="40" y="76" width="820" height="56" rx="4" fill="#11100a" stroke="#78350f" stroke-width="1"/>
  <!-- Parking spaces -->
  <rect x="60" y="84" width="60" height="40" rx="2" fill="#1c1608" stroke="#fbbf24" stroke-width="1"/>
  <text x="90" y="100" text-anchor="middle" font-size="8" fill="#fbbf24">ABC123</text>
  <text x="90" y="113" text-anchor="middle" font-size="7" fill="#4ade80">09:00→11:30</text>
  <rect x="130" y="84" width="60" height="40" rx="2" fill="#1c1608" stroke="#fbbf24" stroke-width="1"/>
  <text x="160" y="100" text-anchor="middle" font-size="8" fill="#fbbf24">XYZ789</text>
  <text x="160" y="113" text-anchor="middle" font-size="7" fill="#4ade80">10:00→10:45</text>
  <rect x="200" y="84" width="60" height="40" rx="2" fill="#1c1608" stroke="#f87171" stroke-width="1.5"/>
  <text x="230" y="100" text-anchor="middle" font-size="8" fill="#f87171">DEF456</text>
  <text x="230" y="113" text-anchor="middle" font-size="7" fill="#fbbf24">14:00→ ? (parked)</text>
  <!-- Empty spaces -->
  <rect x="270" y="84" width="60" height="40" rx="2" fill="#1c1608" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="107" text-anchor="middle" font-size="8" fill="#334155">EMPTY</text>
  <rect x="340" y="84" width="60" height="40" rx="2" fill="#1c1608" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="370" y="107" text-anchor="middle" font-size="8" fill="#334155">EMPTY</text>
  <text x="430" y="107" font-size="16" fill="#4a3f1a">·····</text>
  <!-- Entry/Exit -->
  <rect x="740" y="84" width="108" height="40" rx="2" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
  <text x="794" y="98" text-anchor="middle" font-size="8" fill="#4ade80">ENTRY / EXIT</text>
  <text x="794" y="112" text-anchor="middle" font-size="7" fill="#86efac">HH:MM timestamp</text>
  <text x="650" y="107" text-anchor="middle" font-size="10" fill="#4a3f1a">Time: HH:MM format  |  Rate: $/hr</text>

  <!-- Three class cards -->
  <!-- Vehicle -->
  <rect x="40" y="148" width="240" height="120" rx="6" fill="url(#cardP)" stroke="#78350f" stroke-width="1.5"/>
  <rect x="40" y="148" width="240" height="26" rx="6" fill="url(#hdrP)"/>
  <rect x="40" y="166" width="240" height="8" fill="url(#hdrP)"/>
  <text x="160" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#fef9c3">Vehicle</text>
  <text x="56" y="190" font-size="10" fill="#64748b">Fields:</text>
  <text x="56" y="206" font-size="10" fill="#fde68a">• licensePlate: String  (identity key)</text>
  <text x="56" y="222" font-size="10" fill="#fde68a">• vehicleType: String  (Car/Motorcycle/etc)</text>
  <text x="56" y="238" font-size="10" fill="#fde68a">• color: String</text>
  <text x="56" y="256" font-size="10" fill="#64748b">equals() + hashCode() by licensePlate</text>

  <!-- ParkingSession -->
  <rect x="330" y="148" width="240" height="120" rx="6" fill="url(#cardP)" stroke="#78350f" stroke-width="1.5"/>
  <rect x="330" y="148" width="240" height="26" rx="6" fill="url(#hdrP)"/>
  <rect x="330" y="166" width="240" height="8" fill="url(#hdrP)"/>
  <text x="450" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#fef9c3">ParkingSession</text>
  <text x="346" y="190" font-size="10" fill="#64748b">Fields: vehicle, entryTime, exitTime, date, hourlyRate</text>
  <text x="346" y="208" font-size="10" fill="#fde68a">• getDurationMinutes() → exitMin - entryMin</text>
  <text x="362" y="222" font-size="9" fill="#6b5a2a">  null exitTime → returns -1 (still parked)</text>
  <text x="346" y="240" font-size="10" fill="#fde68a">• getFee() → (duration / 60.0) × hourlyRate</text>
  <text x="362" y="254" font-size="9" fill="#6b5a2a">  duration &lt; 0 → returns 0.0</text>

  <!-- ParkingLot -->
  <rect x="620" y="148" width="240" height="120" rx="6" fill="url(#cardP)" stroke="#78350f" stroke-width="1.5"/>
  <rect x="620" y="148" width="240" height="26" rx="6" fill="url(#hdrP)"/>
  <rect x="620" y="166" width="240" height="8" fill="url(#hdrP)"/>
  <text x="740" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#fef9c3">ParkingLot</text>
  <text x="636" y="190" font-size="10" fill="#64748b">Fields: lotName, sessions: List&lt;ParkingSession&gt;</text>
  <text x="636" y="206" font-size="10" fill="#fde68a">• getTotalSessions() / getCurrentlyParkedCount()</text>
  <text x="636" y="222" font-size="10" fill="#fde68a">• getTotalRevenue() → sum of getFee()</text>
  <text x="636" y="238" font-size="10" fill="#e11d48" font-weight="bold">★ BUG: getAverageParkingDuration()</text>
  <text x="636" y="254" font-size="10" fill="#fde68a">• getLongestParkingSession() → Object[]</text>

  <!-- Arrows -->
  <line x1="280" y1="208" x2="326" y2="208" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAm)"/>
  <text x="303" y="201" text-anchor="middle" font-size="8" fill="#6b5a2a">has</text>
  <line x1="570" y1="208" x2="616" y2="208" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAm)"/>
  <text x="593" y="201" text-anchor="middle" font-size="8" fill="#6b5a2a">manages</text>

  <!-- Bug Fix -->
  <rect x="40" y="282" width="820" height="86" rx="6" fill="#1a0000" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="40" y="282" width="820" height="22" rx="6" fill="#7f1d1d"/>
  <rect x="40" y="296" width="820" height="8" fill="#7f1d1d"/>
  <text x="450" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#fca5a5" letter-spacing="2">BUG FIX  —  ParkingLot.getAverageParkingDuration()</text>
  <text x="60" y="323" font-size="11" fill="#fca5a5" font-weight="bold">Problem:</text>
  <text x="135" y="323" font-size="11" fill="#94a3b8">totalMinutes uses mapToInt() but is stored as double — sum of int values divided by long count causes wrong result</text>
  <text x="60" y="343" font-size="11" fill="#94a3b8">Test: s1=120min + s2=150min = 270 total / 2 sessions = 135 expected, but returns wrong value</text>
  <text x="60" y="360" font-size="11" fill="#4ade80" font-weight="bold">Fix:</text>
  <text x="90" y="360" font-size="11" fill="#94a3b8">Change mapToInt → mapToDouble on completedSessions stream, or cast correctly. The double totalMinutes already works; no cast needed in division.</text>

  <!-- getLongestParkingSession -->
  <rect x="40" y="382" width="820" height="96" rx="6" fill="#111008" stroke="#78350f" stroke-width="1"/>
  <text x="450" y="402" text-anchor="middle" font-size="11" fill="#6b5a2a" letter-spacing="2">getLongestParkingSession()  ALGORITHM</text>
  <!-- Steps with arrows -->
  <rect x="60" y="412" width="110" height="36" rx="4" fill="#1c1608" stroke="#78350f"/>
  <text x="115" y="427" text-anchor="middle" font-size="9" fill="#fde68a">Filter sessions</text>
  <text x="115" y="441" text-anchor="middle" font-size="9" fill="#fbbf24">exitTime != null</text>
  <line x1="170" y1="430" x2="202" y2="430" stroke="#78350f" stroke-width="1.5" marker-end="url(#arrowAm)"/>
  <rect x="204" y="412" width="110" height="36" rx="4" fill="#1c1608" stroke="#78350f"/>
  <text x="259" y="427" text-anchor="middle" font-size="9" fill="#fde68a">Find max duration</text>
  <text x="259" y="441" text-anchor="middle" font-size="9" fill="#fbbf24">getDurationMinutes()</text>
  <line x1="314" y1="430" x2="346" y2="430" stroke="#78350f" stroke-width="1.5" marker-end="url(#arrowAm)"/>
  <rect x="348" y="412" width="110" height="36" rx="4" fill="#1c1608" stroke="#78350f"/>
  <text x="403" y="427" text-anchor="middle" font-size="9" fill="#fde68a">Extract plate +</text>
  <text x="403" y="441" text-anchor="middle" font-size="9" fill="#fbbf24">duration</text>
  <line x1="458" y1="430" x2="490" y2="430" stroke="#78350f" stroke-width="1.5" marker-end="url(#arrowAm)"/>
  <rect x="492" y="412" width="130" height="36" rx="4" fill="#1c1608" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="557" y="427" text-anchor="middle" font-size="9" fill="#fbbf24">Return Object[]</text>
  <text x="557" y="441" text-anchor="middle" font-size="9" fill="#fbbf24">{licensePlate, minutes}</text>
  <text x="650" y="430" font-size="10" fill="#94a3b8">null if no completed sessions</text>
  <text x="60" y="468" font-size="10" fill="#fde68a">Example: ABC123=150min, XYZ789=45min, DEF456=240min  →  ["DEF456", 240]</text>

  <!-- Time calculation diagram -->
  <rect x="40" y="490" width="820" height="90" rx="6" fill="#111008" stroke="#78350f" stroke-width="1"/>
  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#6b5a2a" letter-spacing="2">TIME CALCULATION  &amp;  FEE FORMULA</text>
  <!-- Timeline -->
  <line x1="80" y1="538" x2="460" y2="538" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="538" r="5" fill="#4ade80"/>
  <text x="80" y="556" text-anchor="middle" font-size="9" fill="#4ade80">09:00</text>
  <text x="80" y="568" text-anchor="middle" font-size="8" fill="#64748b">entry</text>
  <circle cx="300" cy="538" r="5" fill="#fbbf24"/>
  <text x="300" y="556" text-anchor="middle" font-size="9" fill="#fbbf24">11:30</text>
  <text x="300" y="568" text-anchor="middle" font-size="8" fill="#64748b">exit</text>
  <line x1="80" y1="530" x2="300" y2="530" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="190" y="525" text-anchor="middle" font-size="9" fill="#fbbf24">150 min</text>
  <rect x="480" y="516" width="340" height="55" rx="3" fill="#1c1608" stroke="#78350f"/>
  <text x="490" y="534" font-size="10" fill="#94a3b8">entryMinutes  = 9×60 + 0   = 540</text>
  <text x="490" y="550" font-size="10" fill="#94a3b8">exitMinutes   = 11×60 + 30 = 690</text>
  <text x="490" y="566" font-size="10" fill="#fbbf24">duration = 690 - 540 = 150 min</text>
  <text x="490" y="566" font-size="10" fill="#fbbf24">                                fee = 150/60 × $5 = $12.50</text>

  <!-- Session lifecycle -->
  <rect x="40" y="592" width="820" height="88" rx="6" fill="#111008" stroke="#78350f" stroke-width="1"/>
  <text x="450" y="612" text-anchor="middle" font-size="11" fill="#6b5a2a" letter-spacing="2">SESSION LIFECYCLE</text>
  <!-- States -->
  <rect x="60" y="622" width="100" height="30" rx="3" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
  <text x="110" y="642" text-anchor="middle" font-size="9" fill="#4ade80">Vehicle enters</text>
  <line x1="160" y1="637" x2="190" y2="637" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGn)"/>
  <rect x="192" y="622" width="120" height="30" rx="3" fill="#1c1608" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="252" y="637" text-anchor="middle" font-size="9" fill="#fbbf24">Session created (exitTime=null)</text>
  <line x1="312" y1="637" x2="342" y2="637" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAm)"/>
  <rect x="344" y="622" width="100" height="30" rx="3" fill="#1c1608" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="394" y="632" text-anchor="middle" font-size="9" fill="#fbbf24">Currently</text>
  <text x="394" y="645" text-anchor="middle" font-size="9" fill="#f87171">parked ←counted</text>
  <line x1="444" y1="637" x2="474" y2="637" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAm)"/>
  <rect x="476" y="622" width="110" height="30" rx="3" fill="#1c1608" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="531" y="637" text-anchor="middle" font-size="9" fill="#fbbf24">Exit recorded</text>
  <line x1="586" y1="637" x2="616" y2="637" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGn)"/>
  <rect x="618" y="622" width="110" height="30" rx="3" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
  <text x="673" y="632" text-anchor="middle" font-size="9" fill="#4ade80">Session complete</text>
  <text x="673" y="645" text-anchor="middle" font-size="9" fill="#4ade80">fee calculated</text>
  <text x="56" y="672" font-size="10" fill="#fde68a" font-weight="bold">getLongestParkingSession returns the completed session (exitTime != null) with the highest duration in minutes</text>
</svg>
