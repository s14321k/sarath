<svg width="100%" viewBox="0 0 900 860" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <title>Hurdles Race Tracker — class hierarchy, data flow, bug fix, and algorithm details</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0b1a"/>
      <stop offset="100%" style="stop-color:#1a0e2e"/>
    </linearGradient>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#130d2a"/>
      <stop offset="100%" style="stop-color:#1c1235"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="860" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#e9d5ff" letter-spacing="3" filter="url(#glow)">HURDLES RACE TRACKER — ARCHITECTURE</text>
  <line x1="60" y1="50" x2="840" y2="50" stroke="#4c1d95" stroke-width="1"/>

  <!-- ─── CLASS HIERARCHY ─── -->
  <text x="450" y="72" text-anchor="middle" font-size="10" fill="#6b4fa0" letter-spacing="2">CLASS HIERARCHY</text>

  <!-- Athlete card -->
  <rect x="44" y="82" width="240" height="108" rx="7" fill="url(#cardGrad)" stroke="#5b21b6" stroke-width="1.5"/>
  <rect x="44" y="82" width="240" height="26" rx="7" fill="url(#hdrGrad)"/>
  <rect x="44" y="98" width="240" height="10" fill="url(#hdrGrad)"/>
  <text x="164" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#e9d5ff">Athlete</text>
  <text x="60" y="122" font-size="10" fill="#94a3b8">Fields:</text>
  <text x="60" y="138" font-size="10" fill="#c4b5fd">• athleteId: String  (identity key)</text>
  <text x="60" y="154" font-size="10" fill="#c4b5fd">• name: String</text>
  <text x="60" y="170" font-size="10" fill="#7c5fac">equals() + hashCode() by athleteId</text>
  <text x="60" y="183" font-size="10" fill="#6b4fa0">Identity used in result lookup + winner check</text>

  <!-- StageResult card -->
  <rect x="330" y="82" width="240" height="108" rx="7" fill="url(#cardGrad)" stroke="#5b21b6" stroke-width="1.5"/>
  <rect x="330" y="82" width="240" height="26" rx="7" fill="url(#hdrGrad)"/>
  <rect x="330" y="98" width="240" height="10" fill="url(#hdrGrad)"/>
  <text x="450" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#e9d5ff">StageResult</text>
  <text x="346" y="122" font-size="10" fill="#94a3b8">Fields:</text>
  <text x="346" y="138" font-size="10" fill="#c4b5fd">• athlete: Athlete  (who ran this stage)</text>
  <text x="346" y="154" font-size="10" fill="#c4b5fd">• stageNumber: int  (1, 2, 3, or 4)</text>
  <text x="346" y="170" font-size="10" fill="#c4b5fd">• timeSeconds: double</text>
  <text x="346" y="183" font-size="10" fill="#6b4fa0">One row per athlete per stage completed</text>

  <!-- HurdlesRace card -->
  <rect x="616" y="82" width="240" height="108" rx="7" fill="url(#cardGrad)" stroke="#5b21b6" stroke-width="1.5"/>
  <rect x="616" y="82" width="240" height="26" rx="7" fill="url(#hdrGrad)"/>
  <rect x="616" y="98" width="240" height="10" fill="url(#hdrGrad)"/>
  <text x="736" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#e9d5ff">HurdlesRace</text>
  <text x="632" y="122" font-size="10" fill="#94a3b8">Fields: stageResults: List&lt;StageResult&gt;</text>
  <text x="632" y="138" font-size="10" fill="#c4b5fd">• hasFinished(id) → boolean</text>
  <text x="632" y="154" font-size="10" fill="#c4b5fd">• getTotalTime(id) → double</text>
  <text x="632" y="170" font-size="10" fill="#e11d48" font-weight="bold">★ BUG: getWinner() — no DNF filter</text>
  <text x="632" y="183" font-size="10" fill="#c4b5fd">• getBestOfBestTime() → double</text>

  <!-- Arrows between class cards -->
  <line x1="284" y1="136" x2="326" y2="136" stroke="#5b21b6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowW)"/>
  <text x="305" y="129" text-anchor="middle" font-size="8" fill="#6b4fa0">has</text>
  <line x1="570" y1="136" x2="612" y2="136" stroke="#5b21b6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowW)"/>
  <text x="591" y="129" text-anchor="middle" font-size="8" fill="#6b4fa0">collects</text>

  <!-- ─── BUG FIX BANNER ─── -->
  <rect x="44" y="204" width="812" height="36" rx="6" fill="#3b0a0a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#fca5a5" letter-spacing="1">🐛  BUG FIX — HurdlesRace.getWinner()</text>
  <text x="450" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">Problem: no hasFinished() check → Dave's partial 40.2 s beats Bob's full 54.2 s    Fix: add  if (!hasFinished(id)) continue;  before the bestTime comparison</text>

  <!-- ─── DATA PIPELINE ─── -->
  <text x="450" y="262" text-anchor="middle" font-size="10" fill="#6b4fa0" letter-spacing="2">DATA PIPELINE</text>

  <!-- Pipeline steps -->
  <rect x="44" y="270" width="118" height="38" rx="4" fill="#1a0e2e" stroke="#334155"/>
  <text x="103" y="285" text-anchor="middle" font-size="9" fill="#94a3b8">Add StageResults</text>
  <text x="103" y="298" text-anchor="middle" font-size="9" fill="#a78bfa">addStageResult()</text>
  <line x1="162" y1="289" x2="192" y2="289" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="194" y="270" width="118" height="38" rx="4" fill="#1a0e2e" stroke="#334155"/>
  <text x="253" y="285" text-anchor="middle" font-size="9" fill="#94a3b8">Count stages</text>
  <text x="253" y="298" text-anchor="middle" font-size="9" fill="#a78bfa">hasFinished(id)</text>
  <line x1="312" y1="289" x2="342" y2="289" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="344" y="270" width="118" height="38" rx="4" fill="#1a0e2e" stroke="#334155"/>
  <text x="403" y="285" text-anchor="middle" font-size="9" fill="#94a3b8">Sum times</text>
  <text x="403" y="298" text-anchor="middle" font-size="9" fill="#a78bfa">getTotalTime(id)</text>
  <line x1="462" y1="289" x2="492" y2="289" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="494" y="270" width="118" height="38" rx="4" fill="#1a0e2e" stroke="#dc2626" stroke-width="1.5"/>
  <text x="553" y="285" text-anchor="middle" font-size="9" fill="#fca5a5">Filter finishers</text>
  <text x="553" y="298" text-anchor="middle" font-size="9" fill="#fca5a5">getWinner() ← FIX</text>
  <line x1="612" y1="289" x2="642" y2="289" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="644" y="270" width="118" height="38" rx="4" fill="#1a0e2e" stroke="#334155"/>
  <text x="703" y="285" text-anchor="middle" font-size="9" fill="#94a3b8">Min per stage</text>
  <text x="703" y="298" text-anchor="middle" font-size="9" fill="#a78bfa">getBestOfBestTime()</text>
  <line x1="762" y1="289" x2="792" y2="289" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="794" y="270" width="62" height="38" rx="4" fill="#1a0e2e" stroke="#334155"/>
  <text x="825" y="285" text-anchor="middle" font-size="9" fill="#4ade80">Results</text>
  <text x="825" y="298" text-anchor="middle" font-size="9" fill="#4ade80">returned</text>

  <!-- ─── getWinner algorithm ─── -->
  <rect x="44" y="326" width="400" height="148" rx="7" fill="#0d1117" stroke="#5b21b6" stroke-width="1"/>
  <text x="244" y="346" text-anchor="middle" font-size="11" fill="#6b4fa0" letter-spacing="1">getWinner()  ALGORITHM  (after fix)</text>

  <!-- Flowchart inside -->
  <rect x="64" y="356" width="140" height="28" rx="4" fill="#1a0e2e" stroke="#5b21b6"/>
  <text x="134" y="375" text-anchor="middle" font-size="9" fill="#c4b5fd">Collect all athleteIds</text>
  <line x1="204" y1="370" x2="224" y2="370" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="226" y="356" width="140" height="28" rx="4" fill="#1a0e2e" stroke="#dc2626" stroke-width="1.5"/>
  <text x="296" y="371" text-anchor="middle" font-size="9" fill="#fca5a5">hasFinished(id)?</text>
  <text x="296" y="382" text-anchor="middle" font-size="9" fill="#fca5a5">NO → skip (DNF)</text>

  <line x1="134" y1="384" x2="134" y2="402" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="64" y="404" width="140" height="28" rx="4" fill="#1a0e2e" stroke="#5b21b6"/>
  <text x="134" y="423" text-anchor="middle" font-size="9" fill="#c4b5fd">getTotalTime(id)</text>

  <line x1="204" y1="418" x2="224" y2="418" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="226" y="404" width="140" height="28" rx="4" fill="#1a0e2e" stroke="#5b21b6"/>
  <text x="296" y="423" text-anchor="middle" font-size="9" fill="#c4b5fd">total &lt; bestTime?</text>

  <line x1="134" y1="432" x2="134" y2="452" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="64" y="452" width="300" height="15" rx="3" fill="#1a2e1a" stroke="#4ade80" stroke-width="1"/>
  <text x="214" y="464" text-anchor="middle" font-size="9" fill="#4ade80">→ return idToName.get(winnerId)</text>

  <!-- ─── getBestOfBestTime algorithm ─── -->
  <rect x="460" y="326" width="396" height="148" rx="7" fill="#0d1117" stroke="#5b21b6" stroke-width="1"/>
  <text x="658" y="346" text-anchor="middle" font-size="11" fill="#6b4fa0" letter-spacing="1">getBestOfBestTime()  ALGORITHM</text>

  <text x="476" y="366" font-size="10" fill="#94a3b8">For each stage s ∈ {1, 2, 3, 4}:</text>
  <text x="476" y="382" font-size="10" fill="#c4b5fd">  Collect all timeSeconds where stageNumber == s</text>
  <text x="476" y="398" font-size="10" fill="#c4b5fd">  minTime[s] = min of collected values</text>
  <text x="476" y="414" font-size="10" fill="#facc15">  (includes DNF athletes — partial data is valid!)</text>
  <text x="476" y="434" font-size="10" fill="#94a3b8">Sum all minTime[s] → bestOfBest</text>
  <text x="476" y="450" font-size="10" fill="#94a3b8">If no results at all → return -1.0</text>
  <rect x="476" y="458" width="362" height="8" rx="2" fill="#1f2d1a" stroke="#4ade80" stroke-width="0.5"/>
  <text x="657" y="466" text-anchor="middle" font-size="9" fill="#4ade80">12.9 + 13.4 + 13.6 + 13.5 = 53.4 s</text>

  <!-- ─── Race table ─── -->
  <rect x="44" y="490" width="812" height="148" rx="7" fill="#0d1117" stroke="#334155" stroke-width="1"/>
  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#6b4fa0" letter-spacing="2">RACE DATA TABLE</text>

  <!-- Table header -->
  <rect x="60" y="518" width="780" height="20" rx="2" fill="#1e1035"/>
  <text x="120" y="532" text-anchor="middle" font-size="10" fill="#94a3b8">Athlete</text>
  <text x="250" y="532" text-anchor="middle" font-size="10" fill="#94a3b8">Stage 1</text>
  <text x="360" y="532" text-anchor="middle" font-size="10" fill="#94a3b8">Stage 2</text>
  <text x="470" y="532" text-anchor="middle" font-size="10" fill="#94a3b8">Stage 3</text>
  <text x="580" y="532" text-anchor="middle" font-size="10" fill="#94a3b8">Stage 4</text>
  <text x="680" y="532" text-anchor="middle" font-size="10" fill="#94a3b8">Total</text>
  <text x="790" y="532" text-anchor="middle" font-size="10" fill="#94a3b8">Status</text>

  <!-- Alice -->
  <text x="120" y="552" text-anchor="middle" font-size="10" fill="#c4b5fd">Alice</text>
  <text x="250" y="552" text-anchor="middle" font-size="10" fill="#c4b5fd">13.5</text>
  <text x="360" y="552" text-anchor="middle" font-size="10" fill="#c4b5fd">14.2</text>
  <text x="470" y="552" text-anchor="middle" font-size="10" fill="#c4b5fd">13.8</text>
  <text x="580" y="552" text-anchor="middle" font-size="10" fill="#c4b5fd">14.0</text>
  <text x="680" y="552" text-anchor="middle" font-size="10" fill="#c4b5fd">55.5</text>
  <text x="790" y="552" text-anchor="middle" font-size="10" fill="#4ade80">Finisher</text>

  <!-- Bob -->
  <rect x="60" y="556" width="780" height="18" rx="1" fill="#0d2010" opacity="0.6"/>
  <text x="120" y="569" text-anchor="middle" font-size="10" fill="#c4b5fd">Bob</text>
  <text x="250" y="569" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">12.9 ★</text>
  <text x="360" y="569" text-anchor="middle" font-size="10" fill="#c4b5fd">13.7</text>
  <text x="470" y="569" text-anchor="middle" font-size="10" fill="#c4b5fd">14.1</text>
  <text x="580" y="569" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">13.5 ★</text>
  <text x="680" y="569" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">54.2 🏆</text>
  <text x="790" y="569" text-anchor="middle" font-size="10" fill="#4ade80">Finisher</text>

  <!-- Carol -->
  <text x="120" y="586" text-anchor="middle" font-size="10" fill="#c4b5fd">Carol</text>
  <text x="250" y="586" text-anchor="middle" font-size="10" fill="#c4b5fd">14.1</text>
  <text x="360" y="586" text-anchor="middle" font-size="10" fill="#c4b5fd">13.5</text>
  <text x="470" y="586" text-anchor="middle" font-size="10" fill="#c4b5fd">13.9</text>
  <text x="580" y="586" text-anchor="middle" font-size="10" fill="#c4b5fd">14.3</text>
  <text x="680" y="586" text-anchor="middle" font-size="10" fill="#c4b5fd">55.8</text>
  <text x="790" y="586" text-anchor="middle" font-size="10" fill="#4ade80">Finisher</text>

  <!-- Dave -->
  <rect x="60" y="590" width="780" height="18" rx="1" fill="#2a0a0a" opacity="0.6"/>
  <text x="120" y="603" text-anchor="middle" font-size="10" fill="#fca5a5">Dave</text>
  <text x="250" y="603" text-anchor="middle" font-size="10" fill="#c4b5fd">13.2</text>
  <text x="360" y="603" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">13.4 ★</text>
  <text x="470" y="603" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">13.6 ★</text>
  <text x="580" y="603" text-anchor="middle" font-size="10" fill="#475569">— (DNF)</text>
  <text x="680" y="603" text-anchor="middle" font-size="10" fill="#fca5a5">40.2 (partial)</text>
  <text x="790" y="603" text-anchor="middle" font-size="10" fill="#f87171">DNF ✗</text>

  <!-- Best row -->
  <rect x="60" y="608" width="780" height="22" rx="2" fill="#1c1535"/>
  <text x="120" y="623" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">BEST</text>
  <text x="250" y="623" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">12.9</text>
  <text x="360" y="623" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">13.4</text>
  <text x="470" y="623" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">13.6</text>
  <text x="580" y="623" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">13.5</text>
  <text x="680" y="623" text-anchor="middle" font-size="10" fill="#facc15" font-weight="bold">= 53.4 s</text>
  <text x="790" y="623" text-anchor="middle" font-size="10" fill="#facc15">bestOfBests</text>

  <!-- ─── Legend ─── -->
  <rect x="44" y="652" width="812" height="82" rx="7" fill="#0d1117" stroke="#334155" stroke-width="1"/>
  <text x="450" y="672" text-anchor="middle" font-size="10" fill="#6b4fa0" letter-spacing="2">KEY RULES</text>
  <circle cx="64" cy="688" r="4" fill="#dc2626"/>
  <text x="75" y="692" font-size="10" fill="#fca5a5">getWinner() must call hasFinished(id) — skip any athlete who has not completed all 4 stages (DNF)</text>
  <circle cx="64" cy="706" r="4" fill="#facc15"/>
  <text x="75" y="710" font-size="10" fill="#fde68a">getBestOfBestTime() uses ALL stage results including DNF athletes (their recorded stages are valid data)</text>
  <circle cx="64" cy="724" r="4" fill="#4ade80"/>
  <text x="75" y="728" font-size="10" fill="#86efac">hasFinished(id): counts distinct stageNumbers for that id — must equal TOTAL_STAGES (4) to be a finisher</text>

  <!-- ─── Results strip ─── -->
  <rect x="44" y="746" width="812" height="76" rx="7" fill="#0d2010" stroke="#4ade80" stroke-width="1"/>
  <text x="450" y="766" text-anchor="middle" font-size="11" fill="#86efac" letter-spacing="1.5">RESULTS</text>
  <text x="450" y="786" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">getWinner()  →  "Bob"   (54.2 s, lowest among finishers)</text>
  <text x="450" y="808" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">getBestOfBestTime()  →  53.4 s   (12.9 + 13.4 + 13.6 + 13.5)</text>
</svg>
