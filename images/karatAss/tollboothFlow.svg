<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="'Georgia', serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="entryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4731" />
      <stop offset="100%" style="stop-color:#2d7a52" />
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3347" />
      <stop offset="100%" style="stop-color:#2d6ea0" />
    </linearGradient>
    <linearGradient id="exitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#47221a" />
      <stop offset="100%" style="stop-color:#a04d2d" />
    </linearGradient>
    <linearGradient id="classGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3a" />
      <stop offset="100%" style="stop-color:#2a2a4e" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowW" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffffff" opacity="0.7"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#e2e8f0" letter-spacing="3" filter="url(#glow)">TOLLBOOTH LOG ANALYZER</text>
  <line x1="100" y1="50" x2="800" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- HIGHWAY VISUAL -->
  <text x="450" y="78" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="2">HIGHWAY LAYOUT</text>
  <rect x="40" y="88" width="820" height="58" rx="4" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <!-- Road -->
  <rect x="40" y="108" width="820" height="18" fill="#1c2333"/>
  <line x1="40" y1="117" x2="860" y2="117" stroke="#facc15" stroke-width="1" stroke-dasharray="16,12"/>
  <!-- Booth icons -->
  <!-- Entry left -->
  <rect x="100" y="90" width="36" height="16" rx="2" fill="url(#entryGrad)" stroke="#4ade80" stroke-width="1"/>
  <text x="118" y="102" text-anchor="middle" font-size="9" fill="#4ade80" font-weight="bold">ENTRY</text>
  <!-- Mainroad -->
  <rect x="418" y="90" width="64" height="16" rx="2" fill="url(#mainGrad)" stroke="#60a5fa" stroke-width="1"/>
  <text x="450" y="102" text-anchor="middle" font-size="9" fill="#60a5fa" font-weight="bold">MAINROAD</text>
  <!-- Exit right -->
  <rect x="764" y="90" width="36" height="16" rx="2" fill="url(#exitGrad)" stroke="#fb923c" stroke-width="1"/>
  <text x="782" y="102" text-anchor="middle" font-size="9" fill="#fb923c" font-weight="bold">EXIT</text>
  <!-- Car arrows -->
  <text x="180" y="121" font-size="12" fill="#94a3b8">→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→→</text>
  <!-- Direction labels -->
  <text x="55" y="104" font-size="9" fill="#475569">W ←</text>
  <text x="840" y="104" font-size="9" fill="#475569">→ E</text>

  <!-- CLASSES SECTION -->
  <!-- LogEntry Class -->
  <rect x="40" y="165" width="240" height="185" rx="6" fill="url(#classGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="165" width="240" height="28" rx="6" fill="#1e3a5f"/>
  <rect x="40" y="185" width="240" height="8" fill="#1e3a5f"/>
  <text x="160" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd" letter-spacing="1">LogEntry</text>
  <text x="55" y="212" font-size="10" fill="#64748b">Fields:</text>
  <text x="55" y="228" font-size="10" fill="#94a3b8">• timestamp (String → float)</text>
  <text x="55" y="244" font-size="10" fill="#e11d48" font-weight="bold">★ BUG: stored as String, needs float</text>
  <text x="55" y="260" font-size="10" fill="#94a3b8">• licensePlate (String)</text>
  <text x="55" y="276" font-size="10" fill="#94a3b8">• boothType (ENTRY/EXIT/MAINROAD)</text>
  <text x="55" y="292" font-size="10" fill="#94a3b8">• location (int, km)</text>
  <text x="55" y="308" font-size="10" fill="#94a3b8">• direction (EAST / WEST)</text>
  <text x="55" y="332" font-size="10" fill="#64748b">Parses: "44776.619 KTB918 310E MAINROAD"</text>

  <!-- LogFile Class -->
  <rect x="330" y="165" width="240" height="185" rx="6" fill="url(#classGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="330" y="165" width="240" height="28" rx="6" fill="#1e3a5f"/>
  <rect x="330" y="185" width="240" height="8" fill="#1e3a5f"/>
  <text x="450" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd" letter-spacing="1">LogFile</text>
  <text x="345" y="212" font-size="10" fill="#64748b">Fields:</text>
  <text x="345" y="228" font-size="10" fill="#94a3b8">• logEntries: List&lt;LogEntry&gt;</text>
  <text x="345" y="248" font-size="10" fill="#64748b">Methods:</text>
  <text x="345" y="264" font-size="10" fill="#4ade80">• countJourneys() → int</text>
  <text x="360" y="278" font-size="9" fill="#6b7280">Groups entries by license plate,</text>
  <text x="360" y="290" font-size="9" fill="#6b7280">counts ENTRY/EXIT pairs per car</text>
  <text x="345" y="308" font-size="10" fill="#fb923c">• catchSpeeders() → List&lt;String&gt;</text>
  <text x="360" y="322" font-size="9" fill="#6b7280">Checks km/h per 10km segment,</text>
  <text x="360" y="334" font-size="9" fill="#6b7280">flags ≥130 or two segments ≥120</text>

  <!-- Journey Flow -->
  <rect x="620" y="165" width="240" height="185" rx="6" fill="url(#classGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="620" y="165" width="240" height="28" rx="6" fill="#1e3a5f"/>
  <rect x="620" y="185" width="240" height="8" fill="#1e3a5f"/>
  <text x="740" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd" letter-spacing="1">Journey Flow</text>
  <rect x="635" y="205" width="72" height="22" rx="3" fill="url(#entryGrad)" stroke="#4ade80" stroke-width="1"/>
  <text x="671" y="220" text-anchor="middle" font-size="9" fill="#4ade80" font-weight="bold">ENTRY</text>
  <line x1="707" y1="216" x2="738" y2="216" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="740" y="205" width="72" height="22" rx="3" fill="url(#mainGrad)" stroke="#60a5fa" stroke-width="1"/>
  <text x="776" y="220" text-anchor="middle" font-size="9" fill="#60a5fa" font-weight="bold">MAIN×N</text>
  <line x1="671" y1="227" x2="671" y2="248" stroke="#4ade80" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="776" y1="227" x2="776" y2="248" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="671" y1="248" x2="776" y2="248" stroke="#94a3b8" stroke-width="1"/>
  <line x1="723" y1="248" x2="723" y2="262" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowW)"/>
  <rect x="668" y="263" width="72" height="22" rx="3" fill="url(#exitGrad)" stroke="#fb923c" stroke-width="1"/>
  <text x="704" y="278" text-anchor="middle" font-size="9" fill="#fb923c" font-weight="bold">EXIT</text>
  <text x="635" y="305" font-size="9" fill="#94a3b8">Speed check per segment:</text>
  <text x="635" y="318" font-size="9" fill="#fbbf24">10km × 3600 / Δseconds = km/h</text>
  <text x="635" y="331" font-size="9" fill="#f87171">≥130: instant flag | ≥120 ×2: flag</text>
  <text x="635" y="344" font-size="9" fill="#94a3b8">Complete journey = 1 count</text>

  <!-- Arrows between classes -->
  <line x1="280" y1="258" x2="326" y2="258" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowW)"/>
  <text x="303" y="251" text-anchor="middle" font-size="8" fill="#64748b">reads</text>
  <line x1="570" y1="258" x2="616" y2="258" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowW)"/>
  <text x="593" y="251" text-anchor="middle" font-size="8" fill="#64748b">drives</text>

  <!-- Bug Fix Box -->
  <rect x="40" y="372" width="820" height="80" rx="6" fill="#1a0a0a" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="40" y="372" width="820" height="24" rx="6" fill="#7f1d1d"/>
  <rect x="40" y="388" width="820" height="8" fill="#7f1d1d"/>
  <text x="450" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#fca5a5" letter-spacing="2">BUG FIX  —  LogEntry</text>
  <text x="60" y="414" font-size="11" fill="#fca5a5" font-weight="bold">Problem:</text>
  <text x="130" y="414" font-size="11" fill="#94a3b8">timestamp stored as String → getTimestamp() returns String, but test calls assertEquals(44776.619f, ...)</text>
  <text x="60" y="432" font-size="11" fill="#4ade80" font-weight="bold">Fix:</text>
  <text x="90" y="432" font-size="11" fill="#94a3b8">Change  private final String timestamp  →  private final float timestamp</text>
  <text x="90" y="448" font-size="11" fill="#94a3b8">and  this.timestamp = tokens[0]  →  this.timestamp = Float.parseFloat(tokens[0])</text>

  <!-- Data Flow Pipeline -->
  <rect x="40" y="468" width="820" height="90" rx="6" fill="#0d1117" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="487" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="2">DATA PIPELINE</text>
  
  <!-- Pipeline steps -->
  <rect x="60" y="496" width="100" height="38" rx="4" fill="#1a2535" stroke="#334155"/>
  <text x="110" y="511" text-anchor="middle" font-size="9" fill="#94a3b8">Log File</text>
  <text x="110" y="526" text-anchor="middle" font-size="9" fill="#60a5fa">.log → BufferedReader</text>
  <line x1="160" y1="515" x2="190" y2="515" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="192" y="496" width="100" height="38" rx="4" fill="#1a2535" stroke="#334155"/>
  <text x="242" y="511" text-anchor="middle" font-size="9" fill="#94a3b8">Line Parse</text>
  <text x="242" y="526" text-anchor="middle" font-size="9" fill="#60a5fa">String → LogEntry</text>
  <line x1="292" y1="515" x2="322" y2="515" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="324" y="496" width="100" height="38" rx="4" fill="#1a2535" stroke="#334155"/>
  <text x="374" y="511" text-anchor="middle" font-size="9" fill="#94a3b8">Group by</text>
  <text x="374" y="526" text-anchor="middle" font-size="9" fill="#60a5fa">licensePlate</text>
  <line x1="424" y1="515" x2="454" y2="515" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="456" y="496" width="100" height="38" rx="4" fill="#1a2535" stroke="#334155"/>
  <text x="506" y="511" text-anchor="middle" font-size="9" fill="#94a3b8">Count Journeys</text>
  <text x="506" y="526" text-anchor="middle" font-size="9" fill="#4ade80">ENTRY+EXIT pairs</text>
  <line x1="556" y1="515" x2="586" y2="515" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="588" y="496" width="100" height="38" rx="4" fill="#1a2535" stroke="#334155"/>
  <text x="638" y="511" text-anchor="middle" font-size="9" fill="#94a3b8">Speed Check</text>
  <text x="638" y="526" text-anchor="middle" font-size="9" fill="#fb923c">Δloc/Δtime → km/h</text>
  <line x1="688" y1="515" x2="718" y2="515" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="720" y="496" width="120" height="38" rx="4" fill="#1a2535" stroke="#334155"/>
  <text x="780" y="511" text-anchor="middle" font-size="9" fill="#94a3b8">Results</text>
  <text x="780" y="526" text-anchor="middle" font-size="9" fill="#4ade80">journeys / speeders</text>

  <!-- Legend -->
  <rect x="40" y="572" width="820" height="108" rx="6" fill="#0d1117" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="591" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="2">LOG FORMAT  &amp;  SPEED FORMULA</text>
  <text x="60" y="612" font-size="10" fill="#94a3b8">Log line format:</text>
  <rect x="60" y="618" width="500" height="18" rx="2" fill="#1e293b"/>
  <text x="70" y="631" font-size="10" fill="#fbbf24" font-family="monospace">34400.409   SXY288   210E   ENTRY</text>
  <text x="330" y="631" font-size="9" fill="#64748b">  ← timestamp(s)  plate  location+dir  boothType</text>
  <text x="60" y="658" font-size="10" fill="#94a3b8">Speed formula:</text>
  <rect x="160" y="648" width="280" height="18" rx="2" fill="#1e293b"/>
  <text x="170" y="661" font-size="10" fill="#fbbf24" font-family="monospace">speed = (10 km × 3600) / Δseconds</text>
  <text x="60" y="680" font-size="10" fill="#f87171">Flag conditions:  single segment ≥ 130 km/h   OR   any two segments ≥ 120 km/h (per journey)</text>
</svg>
