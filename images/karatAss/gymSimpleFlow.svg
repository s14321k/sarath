<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f0f4f8"/>
  
  <!-- Title -->
  <text x="450" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a365d">💪 Gym Membership System - Simple Flow</text>
  
  <!-- Member joins -->
  <ellipse cx="450" cy="100" rx="100" ry="45" fill="#48bb78" stroke="#38a169" stroke-width="3"/>
  <text x="450" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="white">New Member Joins</text>
  
  <!-- Arrow down -->
  <path d="M 450 145 L 450 190" stroke="#2d3748" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Membership Selection -->
  <rect x="250" y="190" width="400" height="80" fill="#4299e1" stroke="#3182ce" stroke-width="3" rx="10"/>
  <text x="450" y="215" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Choose Membership Type</text>
  <text x="450" y="240" font-size="13" text-anchor="middle" fill="white">🥇 GOLD (Paid) | 🥈 SILVER (Paid) | 🥉 BRONZE (Free)</text>
  
  <!-- Arrow down -->
  <path d="M 450 270 L 450 310" stroke="#2d3748" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Member Created -->
  <rect x="250" y="310" width="400" height="70" fill="#9f7aea" stroke="#805ad5" stroke-width="3" rx="10"/>
  <text x="450" y="335" font-size="15" font-weight="bold" text-anchor="middle" fill="white">👤 Member Account Created</text>
  <text x="450" y="360" font-size="12" text-anchor="middle" fill="white">Member ID • Name • Membership Type</text>
  
  <!-- Bug Alert -->
  <rect x="680" y="315" width="200" height="60" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="5"/>
  <text x="780" y="335" font-size="11" font-weight="bold" text-anchor="middle" fill="#856404">⚠️ BUG HERE!</text>
  <text x="780" y="353" font-size="9" text-anchor="middle" fill="#856404">Constructor parameter</text>
  <text x="780" y="367" font-size="9" text-anchor="middle" fill="#856404">name mismatch</text>
  
  <!-- Arrow down -->
  <path d="M 450 380 L 450 420" stroke="#2d3748" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Workout Tracking -->
  <rect x="100" y="420" width="700" height="180" fill="#e6fffa" stroke="#319795" stroke-width="3" rx="10"/>
  <text x="450" y="450" font-size="18" font-weight="bold" text-anchor="middle" fill="#234e52">🏋️ Workout Session Tracking</text>
  
  <!-- Workout Flow -->
  <g id="workout-flow">
    <rect x="130" y="470" width="180" height="60" fill="#fbb6ce" stroke="#d53f8c" stroke-width="2" rx="5"/>
    <text x="220" y="495" font-size="13" font-weight="bold" text-anchor="middle" fill="#702459">Member Works Out</text>
    <text x="220" y="515" font-size="11" text-anchor="middle" fill="#702459">30 minutes</text>
    
    <path d="M 310 500 L 350 500" stroke="#2d3748" stroke-width="3" marker-end="url(#arrow)"/>
    
    <rect x="350" y="470" width="180" height="60" fill="#c6f6d5" stroke="#38a169" stroke-width="2" rx="5"/>
    <text x="440" y="495" font-size="13" font-weight="bold" text-anchor="middle" fill="#22543d">Add to Sessions</text>
    <text x="440" y="515" font-size="11" text-anchor="middle" fill="#22543d">sessions.add(30)</text>
    
    <path d="M 530 500 L 570 500" stroke="#2d3748" stroke-width="3" marker-end="url(#arrow)"/>
    
    <rect x="570" y="470" width="180" height="60" fill="#bee3f8" stroke="#3182ce" stroke-width="2" rx="5"/>
    <text x="660" y="490" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a365d">Calculate Average</text>
    <text x="660" y="510" font-size="10" text-anchor="middle" fill="#2c5282">Sessions: [30, 60, 90]</text>
    <text x="660" y="525" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c5282">Average: 60 mins</text>
  </g>
  
  <!-- Analytics -->
  <rect x="130" y="545" width="620" height="40" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="440" y="570" font-size="12" font-weight="bold" text-anchor="middle" fill="#7d6608">📊 Analytics: Track member fitness progress over time</text>
  
  <!-- Bottom Example -->
  <rect x="150" y="615" width="600" height="25" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="450" y="633" font-size="11" text-anchor="middle" fill="#065f46">💡 Example: GOLD member with 3 sessions (30, 60, 90 mins) → Average: 60 mins/session</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#2d3748"/>
    </marker>
  </defs>
</svg>
