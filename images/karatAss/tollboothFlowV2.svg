<svg width="100%" viewBox="0 0 682 820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Tollbooth log analyzer data flow: LogEntry → LogFile → countJourneys / catchSpeeders</title>
  <desc>Diagram showing how log lines are parsed into LogEntry objects, loaded into a LogFile, and produce journey counts and speeder lists.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Log File source box -->
  <g>
    <rect x="240" y="20" width="200" height="52" rx="8" stroke-width="0.5" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236)"/>
    <text x="340" y="42" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:14px;font-weight:500">Log File (.log)</text>
    <text x="340" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:12px">raw text lines, one event per line</text>
  </g>

  <!-- Arrow Log File → LogEntries -->
  <line x1="340" y1="72" x2="340" y2="104" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- LogEntry row — four sample entries -->
  <g>
    <rect x="20" y="104" width="148" height="72" rx="8" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165)"/>
    <text x="94" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:500">LogEntry</text>
    <text x="94" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">JOX304  250E</text>
    <text x="94" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">ENTRY ✓</text>
  </g>
  <g>
    <rect x="188" y="104" width="148" height="72" rx="8" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165)"/>
    <text x="262" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:500">LogEntry</text>
    <text x="262" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">JOX304  260E</text>
    <text x="262" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">MAINROAD →</text>
  </g>
  <g>
    <rect x="356" y="104" width="148" height="72" rx="8" stroke-width="0.5" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165)"/>
    <text x="430" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:500">LogEntry</text>
    <text x="430" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">JOX304  280E</text>
    <text x="430" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px">EXIT ✓</text>
  </g>
  <g>
    <rect x="524" y="104" width="148" height="72" rx="8" stroke-width="0.5" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123)"/>
    <text x="598" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:13px;font-weight:500">LogEntry</text>
    <text x="598" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px">TST002  260W</text>
    <text x="598" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px">EXIT  130 km/h !</text>
  </g>

  <!-- Bug fix callout -->
  <rect x="20" y="186" width="642" height="30" rx="6" stroke-width="0.5" style="fill:rgb(80, 20, 20);stroke:rgb(220, 80, 80)"/>
  <text x="341" y="201" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 160, 160);font-size:12px">🐛 BUG FIX — LogEntry.timestamp: String → float   (Float.parseFloat replaces direct assignment)</text>

  <!-- Arrows LogEntries → LogFile -->
  <line x1="94" y1="216" x2="280" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <line x1="262" y1="216" x2="310" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <line x1="430" y1="216" x2="370" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <line x1="598" y1="216" x2="400" y2="270" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- LogFile box -->
  <g>
    <rect x="200" y="270" width="280" height="52" rx="8" stroke-width="0.5" style="fill:rgb(12, 68, 124);stroke:rgb(133, 183, 235)"/>
    <text x="340" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(181, 212, 244);font-size:14px;font-weight:500">LogFile</text>
    <text x="340" y="310" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 183, 235);font-size:12px">List&lt;LogEntry&gt; — all parsed events</text>
  </g>

  <!-- countJourneys arrow -->
  <line x1="270" y1="322" x2="190" y2="358" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>
  <!-- catchSpeeders arrow -->
  <line x1="410" y1="322" x2="490" y2="358" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- countJourneys box -->
  <g>
    <rect x="60" y="358" width="260" height="72" rx="8" stroke-width="0.5" style="fill:rgb(39, 80, 10);stroke:rgb(151, 196, 89)"/>
    <text x="190" y="382" text-anchor="middle" dominant-baseline="central" style="fill:rgb(192, 221, 151);font-size:14px;font-weight:500">countJourneys()</text>
    <text x="190" y="402" text-anchor="middle" dominant-baseline="central" style="fill:rgb(151, 196, 89);font-size:12px">count ENTRY events per plate</text>
    <text x="190" y="420" text-anchor="middle" dominant-baseline="central" style="fill:rgb(151, 196, 89);font-size:12px">→ sum across all plates</text>
  </g>

  <!-- catchSpeeders box -->
  <g>
    <rect x="360" y="358" width="260" height="72" rx="8" stroke-width="0.5" style="fill:rgb(99, 56, 6);stroke:rgb(239, 159, 39)"/>
    <text x="490" y="382" text-anchor="middle" dominant-baseline="central" style="fill:rgb(250, 199, 117);font-size:14px;font-weight:500">catchSpeeders()</text>
    <text x="490" y="402" text-anchor="middle" dominant-baseline="central" style="fill:rgb(239, 159, 39);font-size:12px">speed = 10×3600 / Δseconds</text>
    <text x="490" y="420" text-anchor="middle" dominant-baseline="central" style="fill:rgb(239, 159, 39);font-size:12px">flag per journey, not per segment</text>
  </g>

  <!-- Speed rule note -->
  <text x="340" y="460" text-anchor="middle" dominant-baseline="central" style="fill:rgb(194, 192, 182);font-size:12px">speed rules: ≥130 km/h (1 segment)  OR  ≥120 km/h (any 2 segments) within one journey</text>

  <!-- Section divider -->
  <line x1="40" y1="488" x2="642" y2="488" style="stroke:rgb(211, 207, 192);stroke-width:0.6;stroke-dasharray:6,4"/>

  <!-- Dashed arrow from LogFile down to Journey Lifecycle -->
  <line x1="340" y1="322" x2="340" y2="516" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5;stroke-dasharray:4,3"/>

  <!-- Journey Lifecycle box -->
  <g>
    <rect x="50" y="516" width="260" height="90" rx="8" style="fill:#3a2c7a;stroke:#b2aeea;stroke-width:.5"/>
    <text x="180" y="540" text-anchor="middle" style="fill:#e0ddf7;font-size:14px;font-weight:500">Journey per plate</text>
    <text x="180" y="560" text-anchor="middle" style="fill:#b2aeea;font-size:12px">ENTRY → MAINROAD×N → EXIT</text>
    <text x="180" y="578" text-anchor="middle" style="fill:#b2aeea;font-size:12px">e.g. JOX304: 1 journey</text>
    <text x="180" y="596" text-anchor="middle" style="fill:#b2aeea;font-size:12px">     THX138: 2 journeys</text>
  </g>

  <!-- Arrow from Journey to catchSpeeders detail -->
  <line x1="310" y1="561" x2="360" y2="561" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- Speed check detail box -->
  <g>
    <rect x="360" y="508" width="300" height="148" rx="10" style="fill:#0b3a47;stroke:#7cd1e6;stroke-width:.5"/>
    <text x="510" y="532" text-anchor="middle" style="fill:#c8f1fb;font-size:14px;font-weight:600">Speed Check (per segment)</text>
    <text x="510" y="556" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">Δseconds = timestamp₂ − timestamp₁</text>
    <text x="510" y="576" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">speed = 10 × 3600 / Δseconds</text>
    <text x="510" y="596" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">≥ 130 km/h → flag immediately</text>
    <text x="510" y="616" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">≥ 120 km/h twice → flag journey</text>
    <text x="510" y="636" text-anchor="middle" style="fill:#7cd1e6;font-size:12px">only 1 ticket issued per journey</text>
  </g>

  <!-- Arrow from speed check down to result -->
  <line x1="510" y1="656" x2="510" y2="686" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5"/>

  <!-- Results box -->
  <g>
    <rect x="60" y="686" width="560" height="100" rx="8" style="fill:#1f5d1f;stroke:#97c459;stroke-width:1"/>
    <text x="340" y="710" text-anchor="middle" style="fill:#c0dd97;font-size:11px;font-weight:400;letter-spacing:1.2px">RESULTS</text>
    <text x="340" y="736" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:500">countJourneys() → int (e.g. 3)</text>
    <text x="340" y="760" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:500">catchSpeeders() → List&lt;String&gt;  e.g. ["TST002", "TST003", "TST003"]</text>
  </g>

</svg>
