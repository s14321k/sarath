  <rect x="770" y="230" width="260" height="30" fill="#FFCC80"/>
  <text x="780" y="250">12. Admin Processes</text>


  <!-- Center Flow Arrow -->
  <line x1="350" y1="350" x2="850" y2="350" stroke="black" stroke-width="2"/>

  <!-- Bottom Summary -->
  <rect x="250" y="380" width="700" height="120" fill="#F3E5F5" stroke="#8E24AA"/>
  <text x="300" y="420" font-size="16" font-weight="bold">Result</text>
  <text x="300" y="450">• Scalable microservices</text>
  <text x="300" y="470">• Stateless &amp; cloud-ready</text>
  <text x="300" y="490">• Easy deployment &amp; maintenance</text>

