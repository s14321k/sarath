<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Arial">

  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold">12 Principles of Microservices (12-Factor App)</text>

  <!-- Section 1: Code & Config -->
