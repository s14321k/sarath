  <text x="100" y="95" font-size="16" font-weight="bold">Code &amp; Config</text>

  <rect x="70" y="110" width="260" height="30" fill="#90CAF9"/>
  <text x="80" y="130">1. Codebase</text>

  <rect x="70" y="150" width="260" height="30" fill="#90CAF9"/>
  <text x="80" y="170">2. Dependencies</text>

  <rect x="70" y="190" width="260" height="30" fill="#90CAF9"/>
  <text x="80" y="210">3. Config</text>

  <rect x="70" y="230" width="260" height="30" fill="#90CAF9"/>
  <text x="80" y="250">4. Backing Services</text>


  <!-- Section 2: Build & Runtime -->
  <rect x="400" y="70" width="300" height="200" fill="#E8F5E9" stroke="#43A047"/>
  <text x="460" y="95" font-size="16" font-weight="bold">Build &amp; Runtime</text>

  <rect x="420" y="110" width="260" height="30" fill="#A5D6A7"/>
  <text x="430" y="130">5. Build-Release-Run</text>

  <rect x="420" y="150" width="260" height="30" fill="#A5D6A7"/>
  <text x="430" y="170">6. Processes (Stateless)</text>

  <rect x="420" y="190" width="260" height="30" fill="#A5D6A7"/>
  <text x="430" y="210">7. Port Binding</text>

  <rect x="420" y="230" width="260" height="30" fill="#A5D6A7"/>
  <text x="430" y="250">8. Concurrency</text>


  <!-- Section 3: Scalability & Reliability -->
  <rect x="750" y="70" width="300" height="200" fill="#FFF3E0" stroke="#FB8C00"/>
  <text x="760" y="95" font-size="16" font-weight="bold">Scalability &amp; Reliability</text>

  <rect x="770" y="110" width="260" height="30" fill="#FFCC80"/>
  <text x="780" y="130">9. Disposability</text>

  <rect x="770" y="150" width="260" height="30" fill="#FFCC80"/>
  <text x="780" y="170">10. Dev/Prod Parity</text>

  <rect x="770" y="190" width="260" height="30" fill="#FFCC80"/>
