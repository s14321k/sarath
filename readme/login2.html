<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - S14321K</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="auth-kicker">Private Learning Library</span>
                <h1>S14321K</h1>
                <p>Sign in to load the programming guides, chat, search, and live Markdown editor.</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="loginTab">Login</button>
                <button type="button" class="auth-tab" id="signupTab">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-form">
                <label for="loginUser">Username</label>
                <input id="loginUser" type="text" maxlength="40" autocomplete="username" required>
                <label for="loginPass">Password</label>
                <input id="loginPass" type="password" autocomplete="current-password" required>
                <div class="auth-error" id="loginError"></div>
                <button type="submit">Login</button>
            </form>

            <form id="signupForm" class="auth-form hidden">
                <label for="signupUser">Username</label>
                <input id="signupUser" type="text" maxlength="40" autocomplete="username" required>
                <label for="signupPass">Password</label>
                <input id="signupPass" type="password" autocomplete="new-password" required>
                <label for="signupConfirm">Confirm Password</label>
                <input id="signupConfirm" type="password" autocomplete="new-password" required>
                <div class="auth-error" id="signupError"></div>
                <button type="submit">Create Account</button>
            </form>
        </section>
    </main>

    <script src="../js/visit-config.js"></script>
    <script src="../js/auth-client.js"></script>
    <script src="../js/login-page.js"></script>
</body>
</html>
