<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Patterns Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --text: #e2e2f0;
    --muted: #6b6b8a;
    --accent: #f0c040;
    --accent2: #60d0ff;
    --accent3: #ff6080;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

  header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeDown 0.6s ease both;
  }

  header .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  header h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800;
    line-height: 1.05;
    background: linear-gradient(135deg, #fff 40%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    color: var(--muted);
    margin-top: 0.75rem;
    font-size: 0.95rem;
    font-weight: 400;
  }

  /* Category tabs */
  .tabs {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2rem;
    animation: fadeDown 0.6s 0.1s ease both;
  }

  .tab {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.4rem 1rem;
    border-radius: 2rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

  /* Pattern grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-color, var(--accent));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--card-color, var(--accent)); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .card:hover::before { opacity: 1; }
  .card.hidden { display: none; }

  .card-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
  .card-icon { font-size: 1.5rem; line-height: 1; }
  .card-title { font-weight: 700; font-size: 1rem; }
  .card-category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--card-color, var(--accent));
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  .card-tagline { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
  .card-arrow {
    position: absolute;
    top: 1.1rem; right: 1.1rem;
    color: var(--muted);
    font-size: 0.9rem;
    transition: transform 0.3s, color 0.2s;
  }
  .card:hover .card-arrow { transform: translateX(3px); color: var(--card-color, var(--accent)); }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0.9rem 0;
  }

  .detail-section { margin-bottom: 0.75rem; }
  .detail-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  .detail-text { font-size: 0.875rem; line-height: 1.6; color: #c8c8e0; }

  .use-when {
    background: rgba(255,255,255,0.03);
    border-left: 3px solid var(--card-color, var(--accent));
    padding: 0.5rem 0.75rem;
    border-radius: 0 6px 6px 0;
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--text);
  }

  pre {
    background: #0d0d15;
    border: 1px solid #1a1a2a;
    border-radius: 8px;
    padding: 0.9rem;
    overflow-x: auto;
    margin-top: 0.3rem;
  }
  code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.7;
    color: #a0d8ff;
  }
  .kw { color: #c792ea; }
  .cl { color: #ffcb6b; }
  .cm { color: #546e7a; font-style: italic; }
  .st { color: #c3e88d; }

  /* Analogies */
  .analogy {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
    background: rgba(240,192,64,0.06);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
  }
  .analogy-icon { font-size: 1rem; margin-top: 0.1rem; }
  .analogy-text { font-size: 0.83rem; line-height: 1.55; color: #d0d0e8; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(14px);  } to { opacity:1; transform:translateY(0); } }

  .count-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 1.25rem;
  }
  .count-badge span { color: var(--accent); font-weight: 700; }

  .modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    background: rgba(4, 4, 10, 0.82);
    backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 30;
  }
  .modal.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-panel {
    width: min(920px, 100%);
    max-height: min(88vh, 900px);
    overflow-y: auto;
    background: linear-gradient(180deg, rgba(19,19,26,0.98), rgba(10,10,15,0.98));
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    padding: 1.5rem;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    cursor: pointer;
    font-size: 1.1rem;
  }
  .modal-close:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .modal-header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding-right: 3rem;
    margin-bottom: 1rem;
  }
  .modal-icon {
    font-size: 2rem;
    line-height: 1;
  }
  .modal-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 0.35rem;
  }
  .modal-tagline {
    color: #c8c8e0;
    line-height: 1.6;
    font-size: 0.95rem;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin-bottom: 1rem;
  }
  .meta-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.4rem 0.65rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: #d8d8ea;
  }
  body.modal-open {
    overflow: hidden;
  }

  @media (max-width: 640px) {
    .modal {
      padding: 0.75rem;
    }
    .modal-panel {
      padding: 1.1rem;
      max-height: 92vh;
    }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="label">// Software Engineering</div>
    <h1>Design Patterns</h1>
    <p>Click any card to explore — simple explanations, real analogies, code snippets</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-filter="all">All Patterns</button>
    <button class="tab" data-filter="creational">Creational</button>
    <button class="tab" data-filter="structural">Structural</button>
    <button class="tab" data-filter="behavioral">Behavioral</button>
    <button class="tab" data-filter="architectural">Architectural</button>
    <button class="tab" data-filter="microservice">☁️ Microservices</button>
  </div>

  <div class="count-badge">Showing <span id="count">30</span> patterns</div>

  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="patternModal" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" type="button" aria-label="Close pattern details">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const patterns = [
  {
    icon: "🔒",
    title: "Singleton",
    category: "creational",
    categoryLabel: "Creational",
    color: "#f0c040",
    tagline: "Ensures a class has only one instance and provides a global access point to it.",
    simple: "One and only one object of this class will ever exist. No matter how many times you ask for it, you always get back the exact same one.",
    analogy: "Like the President of a country — there's exactly one at a time, and everyone refers to the same person when they say 'the President'.",
    useWhen: "Managing shared resources that must not be duplicated: database connection pools, logging services, configuration managers, or caches.",
    code: `<span class="kw">class</span> <span class="cl">Singleton</span> {
  <span class="kw">private static</span> <span class="cl">Singleton</span> instance;

  <span class="kw">private</span> Singleton() {} <span class="cm">// no public constructor</span>

  <span class="kw">public static</span> <span class="cl">Singleton</span> getInstance() {
    <span class="kw">if</span> (instance == <span class="kw">null</span>)
      instance = <span class="kw">new</span> <span class="cl">Singleton</span>();
    <span class="kw">return</span> instance; <span class="cm">// always the same one</span>
  }
}`
  },
  {
    icon: "🏭",
    title: "Factory",
    category: "creational",
    categoryLabel: "Creational",
    color: "#f0c040",
    tagline: "Creates objects without the caller needing to know the exact class being instantiated.",
    simple: "Instead of writing <code>new SomeClass()</code> all over your code, you ask a factory method to create the object. The factory decides what to build.",
    analogy: "Like ordering from a bakery: you say 'one cake' — you don't care if it's a chef or a machine that bakes it. You just get your cake.",
    useWhen: "You want to abstract complex object creation, or when the type of object to create may vary based on conditions (e.g. different DB drivers, parsers, or renderers).",
    code: `<span class="kw">interface</span> <span class="cl">Product</span> { <span class="kw">void</span> create(); }

<span class="kw">class</span> <span class="cl">ConcreteProduct</span> <span class="kw">implements</span> <span class="cl">Product</span> {
  <span class="kw">public void</span> create() {
    System.out.println(<span class="st">"Product created."</span>);
  }
}

<span class="kw">class</span> <span class="cl">ProductFactory</span> {
  <span class="kw">public static</span> <span class="cl">Product</span> createProduct() {
    <span class="kw">return new</span> <span class="cl">ConcreteProduct</span>(); <span class="cm">// caller doesn't know this</span>
  }
}`
  },
  {
    icon: "🏭",
    title: "Abstract Factory",
    category: "creational",
    categoryLabel: "Creational",
    color: "#f0c040",
    tagline: "Creates families of related objects without specifying their concrete classes.",
    simple: "Think of it as a factory of factories — a single interface that produces a whole set of related things that belong together.",
    analogy: "Like ordering a 'furniture set' — you get a matching sofa, chair, and table in one style, without picking each piece separately.",
    useWhen: "You need different families of related objects — e.g., a UI library that can produce Windows-style buttons OR Mac-style buttons, but never mix them.",
    code: `<span class="kw">interface</span> <span class="cl">AbstractFactory</span> {
  <span class="cl">Product</span> createProduct();
  <span class="cl">AnotherProduct</span> createAnotherProduct();
}

<span class="kw">class</span> <span class="cl">DarkThemeFactory</span> <span class="kw">implements</span> <span class="cl">AbstractFactory</span> {
  <span class="kw">public</span> <span class="cl">Product</span> createProduct() {
    <span class="kw">return new</span> <span class="cl">DarkButton</span>();
  }
}`
  },
  {
    icon: "🏗️",
    title: "Builder",
    category: "creational",
    categoryLabel: "Creational",
    color: "#f0c040",
    tagline: "Separates object construction from its representation step by step.",
    simple: "Instead of a messy constructor with 10 parameters, you build the object piece by piece — only setting what you need.",
    analogy: "Like a custom sandwich order: bread first, then fillings, then sauces — you chain your choices and get exactly what you want.",
    useWhen: "An object has many optional fields or complex configuration — e.g., building an HTTP request with optional headers, body, timeout, auth...",
    code: `<span class="kw">class</span> <span class="cl">ProductBuilder</span> {
  <span class="kw">private</span> <span class="cl">Product</span> product = <span class="kw">new</span> <span class="cl">Product</span>();

  <span class="kw">public</span> <span class="cl">ProductBuilder</span> withName(<span class="cl">String</span> name) {
    product.setName(name);
    <span class="kw">return this</span>; <span class="cm">// enables chaining</span>
  }

  <span class="kw">public</span> <span class="cl">Product</span> build() { <span class="kw">return</span> product; }
}
<span class="cm">// Usage: new ProductBuilder().withName("X").build()</span>`
  },
  {
    icon: "🔌",
    title: "Adapter",
    category: "structural",
    categoryLabel: "Structural",
    color: "#60d0ff",
    tagline: "Makes two incompatible interfaces work together.",
    simple: "It's a translator — it wraps an old/incompatible class and makes it look like the interface your code expects.",
    analogy: "Like a travel plug adapter: your Indian plug still works, but the adapter makes it fit into a European socket.",
    useWhen: "Integrating a legacy system or third-party library whose interface doesn't match what your code expects.",
    code: `<span class="kw">class</span> <span class="cl">Adapter</span> <span class="kw">implements</span> <span class="cl">Target</span> {
  <span class="kw">private</span> <span class="cl">LegacyService</span> adaptee;

  <span class="kw">public void</span> request() {
    <span class="cm">// translate the call</span>
    adaptee.specificLegacyRequest();
  }
}`
  },
  {
    icon: "🎨",
    title: "Decorator",
    category: "structural",
    categoryLabel: "Structural",
    color: "#60d0ff",
    tagline: "Dynamically adds responsibilities to objects without changing their class.",
    simple: "You wrap an object with another object that adds extra behavior — like layers of an onion, each layer adds a feature.",
    analogy: "Like adding toppings to a coffee: start with espresso, wrap it with milk (latte), wrap that with whipped cream — each wrapper adds to it.",
    useWhen: "You want to add features (logging, caching, validation) to objects at runtime without subclassing everything.",
    code: `<span class="kw">class</span> <span class="cl">LoggingDecorator</span> <span class="kw">implements</span> <span class="cl">Component</span> {
  <span class="kw">private</span> <span class="cl">Component</span> wrapped;

  <span class="kw">public void</span> operation() {
    System.out.println(<span class="st">"Before..."</span>);
    wrapped.operation(); <span class="cm">// delegate</span>
    System.out.println(<span class="st">"After..."</span>);
  }
}`
  },
  {
    icon: "👀",
    title: "Observer",
    category: "behavioral",
    categoryLabel: "Behavioral",
    color: "#ff6080",
    tagline: "One-to-many dependency: when one object changes, all dependents are notified.",
    simple: "A subject keeps a list of listeners. When something happens, it shouts to all of them. The listeners decide what to do.",
    analogy: "Like a YouTube channel: you (the subscriber) get notified whenever the creator (subject) posts something new. The creator doesn't know or care who you are.",
    useWhen: "Event systems, pub/sub, UI state changes, Kafka consumers, or Saga patterns where many components react to one event.",
    code: `<span class="kw">interface</span> <span class="cl">Observer</span> { <span class="kw">void</span> update(<span class="cl">String</span> msg); }

<span class="kw">class</span> <span class="cl">Subject</span> {
  <span class="cl">List</span>&lt;<span class="cl">Observer</span>&gt; observers = <span class="kw">new</span> <span class="cl">ArrayList</span>&lt;&gt;();

  <span class="kw">void</span> notify(<span class="cl">String</span> msg) {
    <span class="kw">for</span> (<span class="cl">Observer</span> o : observers)
      o.update(msg); <span class="cm">// broadcast</span>
  }
}`
  },
  {
    icon: "🧠",
    title: "Strategy",
    category: "behavioral",
    categoryLabel: "Behavioral",
    color: "#ff6080",
    tagline: "Encapsulates algorithms and makes them swappable at runtime.",
    simple: "Instead of hardcoding how to do something, you inject the 'how' from outside. The context doesn't care which strategy is used — it just runs it.",
    analogy: "Like a GPS: you choose 'fastest route', 'avoid tolls', or 'scenic route' — the app swaps the algorithm, but the drive still happens.",
    useWhen: "You have multiple ways to do the same thing (sort algorithms, payment methods, compression formats) and want to switch without changing core logic.",
    code: `<span class="kw">interface</span> <span class="cl">SortStrategy</span> { <span class="kw">void</span> sort(<span class="cl">int</span>[] data); }

<span class="kw">class</span> <span class="cl">Context</span> {
  <span class="kw">private</span> <span class="cl">SortStrategy</span> strategy;

  <span class="kw">void</span> setStrategy(<span class="cl">SortStrategy</span> s) {
    <span class="kw">this</span>.strategy = s;
  }
  <span class="kw">void</span> execute(<span class="kw">int</span>[] data) { strategy.sort(data); }
}`
  },
  {
    icon: "🕹️",
    title: "Command",
    category: "behavioral",
    categoryLabel: "Behavioral",
    color: "#ff6080",
    tagline: "Encapsulates a request as an object — enabling undo, queue, and logging.",
    simple: "You wrap an action (and its data) into an object. This object can be stored, queued, delayed, or reversed.",
    analogy: "Like a restaurant order slip: the waiter writes the order (command object), hands it to the kitchen. The order can be delayed, cancelled, or replayed.",
    useWhen: "Undo/redo systems, task queues, macro recording, or any time you want to decouple who triggers an action from who executes it.",
    code: `<span class="kw">interface</span> <span class="cl">Command</span> { <span class="kw">void</span> execute(); }

<span class="kw">class</span> <span class="cl">SaveCommand</span> <span class="kw">implements</span> <span class="cl">Command</span> {
  <span class="kw">public void</span> execute() {
    System.out.println(<span class="st">"Saving..."</span>);
  }
}

<span class="kw">class</span> <span class="cl">Invoker</span> {
  <span class="cl">Queue</span>&lt;<span class="cl">Command</span>&gt; queue = <span class="kw">new</span> <span class="cl">LinkedList</span>&lt;&gt;();
  <span class="kw">void</span> run() { queue.forEach(<span class="cl">Command</span>::execute); }
}`
  },
  {
    icon: "📐",
    title: "MVC",
    category: "architectural",
    categoryLabel: "Architectural",
    color: "#a0e0a0",
    tagline: "Separates an application into Model, View, and Controller concerns.",
    simple: "Split your app into three lanes: data (Model), display (View), and logic (Controller). Each lane minds its own business.",
    analogy: "Like a restaurant: the kitchen (Model) prepares food, the waiter (Controller) takes orders and relays them, the table presentation (View) is what the customer sees.",
    useWhen: "Building UI-heavy applications where you want clean separation — web apps, mobile apps, desktop GUIs.",
    code: `<span class="cm">// Model — data & business logic</span>
<span class="kw">class</span> <span class="cl">UserModel</span> { <span class="cl">String</span> name; }

<span class="cm">// View — only renders</span>
<span class="kw">class</span> <span class="cl">UserView</span> {
  <span class="kw">void</span> render(<span class="cl">String</span> name) {
    System.out.println(<span class="st">"User: "</span> + name);
  }
}

<span class="cm">// Controller — connects them</span>
<span class="kw">class</span> <span class="cl">UserController</span> {
  <span class="kw">void</span> updateName(<span class="cl">String</span> n) { model.name = n; view.render(n); }
}`
  },

  // ── Missing GoF: Creational ──────────────────────────────────────
  {
    icon: "🧬",
    title: "Prototype",
    category: "creational",
    categoryLabel: "Creational",
    color: "#f0c040",
    tagline: "Creates new objects by cloning an existing instance.",
    simple: "Instead of constructing a new object from scratch, you copy an existing one and tweak only what's different. Cheap and fast.",
    analogy: "Like photocopying a form: you don't rewrite every field — you copy the original and fill in just the parts that differ.",
    useWhen: "Object creation is expensive (DB calls, deep config) and most new objects are nearly identical to an existing one.",
    code: `<span class="kw">interface</span> <span class="cl">Prototype</span> { <span class="cl">Prototype</span> clone(); }

<span class="kw">class</span> <span class="cl">Config</span> <span class="kw">implements</span> <span class="cl">Prototype</span> {
  <span class="cl">String</span> host; <span class="kw">int</span> port;

  <span class="kw">public</span> <span class="cl">Config</span> clone() {
    <span class="cl">Config</span> c = <span class="kw">new</span> <span class="cl">Config</span>();
    c.host = <span class="kw">this</span>.host;
    c.port = <span class="kw">this</span>.port;
    <span class="kw">return</span> c;
  }
}`
  },

  // ── Missing GoF: Structural ──────────────────────────────────────

  <span class="cl">ThreadPoolBulkhead</span>.of(<span class="st">"payment"</span>,
    config.maxThreads(<span class="st">10</span>));

<span class="cl">ThreadPoolBulkhead</span> inventoryPool =
  <span class="cl">ThreadPoolBulkhead</span>.of(<span class="st">"inventory"</span>,
    config.maxThreads(<span class="st">5</span>));
<span class="cm">// payment slowness can't starve inventory</span>`

  {
    icon: "🔄",

  db.save(<span class="kw">new</span> <span class="cl">OutboxEvent</span>(    <span class="cm">// save event</span>

  <span class="cm">// A poller reads outbox → publishes to Kafka</span>

const allPatterns = [
  ...patterns,
  ...missingJavaPatterns.filter(extra => !patterns.some(pattern => pattern.title === extra.title))
].map(pattern => ({
  ...pattern,
  ...javaPatternDetails[pattern.title]
}));


const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const modal = document.getElementById('patternModal');
const modalContent = document.getElementById('modalContent');
const modalClose = document.getElementById('modalClose');

function openModal(pattern) {
  modalContent.innerHTML = `
    <div class="modal-header">
      <div class="modal-icon">${pattern.icon}</div>
      <div>
        <div class="card-category">${pattern.categoryLabel}</div>
        <h2 class="modal-title" id="modalTitle">${pattern.title}</h2>
        <div class="modal-tagline">${pattern.tagline}</div>
      </div>
    </div>
    <div class="meta-row">
      ${pattern.tag ? `<div class="meta-pill">${pattern.tag}</div>` : ''}
      ${pattern.example ? `<div class="meta-pill">${pattern.example}</div>` : ''}
    </div>
    <hr class="divider">
    <div class="detail-section">
      <div class="detail-label">Simply put</div>
      <div class="detail-text">${pattern.simple}</div>
    </div>
    <div class="detail-section">
      <div class="analogy">
        <div class="analogy-icon">💡</div>
        <div class="analogy-text"><strong>Real-world analogy:</strong> ${pattern.analogy}</div>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Use when</div>
      <div class="use-when">${pattern.useWhen}</div>
    </div>
    ${pattern.tip ? `
    <div class="detail-section">
      <div class="detail-label">Key tip</div>
      <div class="detail-text">${pattern.tip}</div>
    </div>` : ''}
    <div class="detail-section">
      <div class="detail-label">Code sketch</div>
      <pre><code>${pattern.code}</code></pre>
    </div>
  `;

  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('modal-open');
  modalClose.focus();
}

function closeModal() {
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('modal-open');
}

function renderCards(filter) {
  const visible = filter === 'all' ? allPatterns : allPatterns.filter(p => p.category === filter);
  countEl.textContent = visible.length;

  grid.innerHTML = '';
  visible.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Open details for ${p.title}`);
    card.style.setProperty('--card-color', p.color);
    card.style.animationDelay = `${i * 0.05}s`;

    card.innerHTML = `
      <div class="card-category">${p.categoryLabel}</div>
      <div class="card-header">
        <div class="card-icon">${p.icon}</div>
        <div class="card-title">${p.title}</div>
      </div>
      <div class="card-tagline">${p.tagline}</div>
      <div class="card-arrow">&rarr;</div>
    `;

    card.addEventListener('click', () => openModal(p));
    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openModal(p);
      }
    });

    grid.appendChild(card);
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    closeModal();
    renderCards(tab.dataset.filter);
  });
});

modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', (event) => {
  if (event.target === modal) closeModal();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && modal.classList.contains('open')) closeModal();
});

renderCards('all');
</script>
